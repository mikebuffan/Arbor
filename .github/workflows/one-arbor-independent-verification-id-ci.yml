name: One Arbor independence verification evidence gate

on:
  push:
    branches:
      - fix/independence-verification-event-dedupe-20261010
      - fix/independence-learning-outcome-proof-20261010
      - fix/independence-invalid-verifier-score-20261010

permissions:
  contents: read

concurrency:
  group: one-arbor-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification-source:
    if: github.repository == 'mikebuffan/Arbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve reviewed source identity
        run: node ops/integration/verify-one-arbor-composition.mjs
      - name: Enforce source-only Vercel branches
        run: node --test ops/grove/source-only-ignore.test.mjs
      - name: Resolve project dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm install --frozen-lockfile
      - name: Learning and verification regression suite
        working-directory: apps/backend
        run: >-
          pnpm exec vitest run
          lib/arbor/agency/__tests__/updateLifecycle.test.ts
          lib/arbor/agency/__tests__/selfUpdateController.test.ts
      - name: Backend TypeScript
        working-directory: apps/backend
        run: pnpm exec tsc --noEmit
      - name: Install required local PDF regression toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdfinfo -v
          pdftotext -v
      - name: Full backend regression
        run: pnpm --filter firefly-backend test
      - name: Backend build (CI only)
        run: pnpm --filter firefly-backend build
