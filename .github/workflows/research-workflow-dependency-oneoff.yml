name: Research Workflow dependency lockfile — one shot

on:
  push:
    branches:
      - feature/research-offline-pdf-batch-pilot-20260923
    paths:
      - ops/research/.workflow-dependency-request

permissions:
  contents: write

concurrency:
  group: research-workflow-dependency-lockfile
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/research-offline-pdf-batch-pilot-20260923
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: corepack prepare pnpm@10.30.3 --activate
      - name: Add official Workflow dependency with pnpm
        run: pnpm --filter firefly-backend add workflow
      - name: Verify only dependency metadata changed
        run: |
          set -euo pipefail
          git status --short
          test -n "$(git status --short apps/backend/package.json pnpm-lock.yaml)"
      - name: Commit generated dependency metadata
        run: |
          set -euo pipefail
          rm -f ops/research/.workflow-dependency-request
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backend/package.json pnpm-lock.yaml ops/research/.workflow-dependency-request
          git commit -m "chore(research): add Vercel Workflow dependency"
          git push origin HEAD:feature/research-offline-pdf-batch-pilot-20260923
