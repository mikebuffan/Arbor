name: ARK successor STOP-resume integration acceptance

on:
  push:
    branches:
      - integration/one-arbor-low-conflict-plus-ark-20261006
  workflow_dispatch:

concurrency:
  group: ark-successor-stop-resume-integration
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Full-repository tsc is intentionally not used as this lane's gate:
      # the One Arbor base currently carries unrelated active research-lane
      # type errors. Focused ARK tests/lint below isolate this child accurately.
      - name: Focused ARK durability tests
        env:
          OPENAI_API_KEY: ci-placeholder-key
        run: |
          pnpm --filter firefly-backend exec vitest run lib/ark/__tests__/stateMachine.test.ts lib/ark/__tests__/runner.test.ts lib/ark/__tests__/supabaseStore.test.ts lib/ark/__tests__/objectiveControl.test.ts lib/ark/__tests__/objectiveControlRoute.test.ts lib/ark/__tests__/readModel.test.ts lib/ark/__tests__/agencyBridge.test.ts lib/ark/__tests__/agencyDispatcher.test.ts lib/ark/__tests__/agencyExecutionDelegate.test.ts lib/ark/__tests__/agencyToolExecutor.test.ts lib/ark/__tests__/activation.test.ts lib/ark/__tests__/handoff.test.ts lib/mcp/__tests__/taskBridge.test.ts lib/mcp/__tests__/objectiveControlBridge.test.ts lib/mcp/__tests__/auth.test.ts lib/mcp/__tests__/registerArkReadTools.test.ts lib/mcp/__tests__/fullStackCanary.test.ts lib/system/__tests__/loop.test.ts

      - name: Focused lint
        run: |
          pnpm --filter firefly-backend exec eslint app/api/ark/objective-control/route.ts app/api/mcp/route.ts lib/ark/activation.ts lib/ark/handoff.ts lib/ark/supabaseStore.ts lib/mcp/auth.ts lib/mcp/registerArkReadTools.ts lib/mcp/registerArkTaskTools.ts lib/mcp/taskPermissions.ts lib/ark/__tests__/stateMachine.test.ts lib/ark/__tests__/objectiveControl.test.ts lib/ark/__tests__/objectiveControlRoute.test.ts lib/mcp/__tests__/objectiveControlBridge.test.ts

  stop-resume-migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arbor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arbor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: arbor_test
    steps:
      - uses: actions/checkout@v4

      - name: Seed minimal Supabase-compatible schema
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create schema auth;
          create function auth.uid() returns uuid
          language sql stable
          as $$
            select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          create table auth.users (id uuid primary key);
          create table public.projects (
            id uuid primary key,
            user_id uuid not null references auth.users(id) on delete cascade
          );
          grant usage on schema public, auth to anon, authenticated, service_role;
          grant select on public.projects to service_role;
          SQL

      - name: Apply ARK schema and offline controls
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260918143000_create_ark_autonomous_work_runner.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260918203000_ark_targeted_objective_claim.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260918210000_ark_owner_integrity.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261006093000_ark_stop_and_resume_controls.sql

      - name: Prove STOP fencing and blocked resume
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            u uuid := '11111111-1111-1111-1111-111111111111';
            p uuid := 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa';
            stop_obj jsonb;
            duplicate_obj jsonb;
            resume_obj jsonb;
            claim jsonb;
            second_claim jsonb;
            blocked jsonb;
            resumed jsonb;
            stopped jsonb;
            completed jsonb;
            verified jsonb;
            task_id uuid;
            lease_token uuid;
            cancel_event_count integer;
          begin
            insert into auth.users(id) values (u);
            insert into public.projects(id, user_id) values (p, u);

            -- STOP an actively leased task.
            stop_obj := public.ark_enqueue_objective(
              u, p, 'stop canary', 0, '{}'::jsonb, 'stop-canary',
              jsonb_build_array(jsonb_build_object(
                'task_key','act','kind','canary.read','description','stop me',
                'dependencies','[]'::jsonb,'payload','{}'::jsonb,
                'max_attempts',3,'idempotency_key','stop-canary:act'
              ))
            );
            -- Same idempotency key + same normalized payload returns the
            -- original objective without duplicating tasks/events.
            duplicate_obj := public.ark_enqueue_objective(
              u, p, 'stop canary', 0, '{}'::jsonb, 'stop-canary',
              jsonb_build_array(jsonb_build_object(
                'task_key','act','kind','canary.read','description','stop me',
                'dependencies','[]'::jsonb,'payload','{}'::jsonb,
                'max_attempts',3,'idempotency_key','stop-canary:act'
              ))
            );
            if duplicate_obj->>'id' <> stop_obj->>'id' then
              raise exception 'idempotent enqueue created a duplicate objective';
            end if;

            begin
              perform public.ark_enqueue_objective(
                u, p, 'changed payload', 0, '{}'::jsonb, 'stop-canary',
                jsonb_build_array(jsonb_build_object(
                  'task_key','act','kind','canary.read','description','stop me',
                  'dependencies','[]'::jsonb,'payload','{}'::jsonb,
                  'max_attempts',3,'idempotency_key','stop-canary:act'
                ))
              );
              raise exception 'changed payload reused an idempotency key';
            exception
              when invalid_parameter_value then null;
            end;

            claim := public.ark_claim_next_task(
              'worker-before-stop', 10000, now(), '{}'::uuid[],
              (stop_obj->>'id')::uuid
            );
            task_id := (claim->'task'->>'id')::uuid;
            lease_token := (claim->'task'->>'lease_token')::uuid;

            -- An active lease must prevent a second worker from claiming the
            -- same task before STOP/expiry.
            second_claim := public.ark_claim_next_task(
              'competing-worker', 10000, now(), '{}'::uuid[],
              (stop_obj->>'id')::uuid
            );
            if second_claim is not null then
              raise exception 'active lease allowed a duplicate worker claim';
            end if;

            stopped := public.ark_cancel_objective((stop_obj->>'id')::uuid, now());
            if stopped->>'status' <> 'cancelled' then
              raise exception 'STOP did not cancel objective';
            end if;
            if (select status from public.ark_tasks where id = task_id) <> 'cancelled' then
              raise exception 'STOP did not cancel active task';
            end if;
            if (select t.lease_token from public.ark_tasks t where t.id = task_id) is not null then
              raise exception 'STOP did not clear lease';
            end if;

            -- Repeated STOP is idempotent and must not append a second
            -- cancellation event.
            stopped := public.ark_cancel_objective((stop_obj->>'id')::uuid, now());
            if stopped->>'status' <> 'cancelled' then
              raise exception 'repeated STOP changed terminal state';
            end if;
            select count(*) into cancel_event_count
            from public.ark_events
            where objective_id = (stop_obj->>'id')::uuid
              and event_type = 'objective_cancelled';
            if cancel_event_count <> 1 then
              raise exception 'repeated STOP duplicated cancellation event';
            end if;

            begin
              perform public.ark_complete_task(
                task_id, 'worker-before-stop', lease_token,
                '{"verified":true}'::jsonb, now()
              );
              raise exception 'stale worker completed after STOP';
            exception
              when serialization_failure then null;
            end;

            if public.ark_claim_next_task(
              'worker-after-stop', 10000, now(), '{}'::uuid[],
              (stop_obj->>'id')::uuid
            ) is not null then
              raise exception 'cancelled objective was claimed again';
            end if;

            -- Resume only a blocked task; completed work is never replayed.
            resume_obj := public.ark_enqueue_objective(
              u, p, 'resume canary', 0, '{}'::jsonb, 'resume-canary',
              jsonb_build_array(jsonb_build_object(
                'task_key','act','kind','canary.read','description','block then resume',
                'dependencies','[]'::jsonb,'payload','{}'::jsonb,
                'max_attempts',3,'idempotency_key','resume-canary:act'
              ))
            );
            claim := public.ark_claim_next_task(
              'block-worker', 10000, now(), '{}'::uuid[],
              (resume_obj->>'id')::uuid
            );
            blocked := public.ark_block_task(
              (claim->'task'->>'id')::uuid,
              'block-worker',
              (claim->'task'->>'lease_token')::uuid,
              '{"kind":"external_authority","message":"needs approval"}'::jsonb,
              now()
            );
            if blocked->'objective'->>'status' <> 'blocked' then
              raise exception 'canary did not block';
            end if;

            resumed := public.ark_resume_blocked_objective(
              (resume_obj->>'id')::uuid, now()
            );
            if resumed->>'status' <> 'queued' then
              raise exception 'blocked objective did not resume';
            end if;

            claim := public.ark_claim_next_task(
              'resume-worker', 10000, now(), '{}'::uuid[],
              (resume_obj->>'id')::uuid
            );
            if claim is null or claim->'task'->>'lease_owner' <> 'resume-worker' then
              raise exception 'resumed task was not claimable';
            end if;

            completed := public.ark_complete_task(
              (claim->'task'->>'id')::uuid,
              'resume-worker',
              (claim->'task'->>'lease_token')::uuid,
              '{"verified":true,"capability":"canary.read","attempts":2}'::jsonb,
              now()
            );
            if completed->'objective'->>'status' <> 'awaiting_verification' then
              raise exception 'resumed objective did not reach verification';
            end if;

            verified := public.ark_verify_objective(
              (resume_obj->>'id')::uuid, true,
              '{"gate":"stop-resume-smoke"}'::jsonb, '{}'::text[], now()
            );
            if verified->>'status' <> 'completed' then
              raise exception 'resumed objective did not complete';
            end if;

            begin
              perform public.ark_cancel_objective((resume_obj->>'id')::uuid, now());
              raise exception 'completed objective was cancellable';
            exception
              when serialization_failure then null;
            end;
          end
          $$;
          SQL

      - name: Prove concurrent workers cannot claim the same task
        shell: bash
        run: |
          set -euo pipefail
          objective_id="$(psql -Atq -v ON_ERROR_STOP=1 -c "
            select public.ark_enqueue_objective(
              '11111111-1111-1111-1111-111111111111'::uuid,
              'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa'::uuid,
              'parallel lease canary',
              0,
              '{}'::jsonb,
              'parallel-lease-canary',
              jsonb_build_array(jsonb_build_object(
                'task_key','act',
                'kind','canary.read',
                'description','parallel claim',
                'dependencies','[]'::jsonb,
                'payload','{}'::jsonb,
                'max_attempts',3,
                'idempotency_key','parallel-lease-canary:act'
              ))
            )->>'id';
          ")"
          test -n "$objective_id"

          first_log="$RUNNER_TEMP/ark-first-claim.log"
          psql -Atq -v ON_ERROR_STOP=1 >"$first_log" <<SQL &
          begin;
          select coalesce(
            public.ark_claim_next_task(
              'parallel-worker-a',
              10000,
              now(),
              '{}'::uuid[],
              '$objective_id'::uuid
            )::text,
            'null'
          );
          select pg_sleep(3);
          commit;
          SQL
          first_pid=$!

          # Give worker A time to acquire the row lock but keep its
          # transaction open. Worker B must SKIP the locked task, not wait,
          # duplicate the claim, or steal the lease.
          sleep 1
          second_claim="$(psql -Atq -v ON_ERROR_STOP=1 -c "
            select coalesce(
              public.ark_claim_next_task(
                'parallel-worker-b',
                10000,
                now(),
                '{}'::uuid[],
                '$objective_id'::uuid
              )::text,
              'null'
            );
          ")"
          test "$second_claim" = "null"

          wait "$first_pid"
          grep -q '"lease_owner": "parallel-worker-a"' "$first_log"

          psql -v ON_ERROR_STOP=1 -c "
            select public.ark_cancel_objective('$objective_id'::uuid, now());
          " >/dev/null

  phone-status-fidelity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - name: Block metadata before checkout
        shell: bash
        run: |
          set -euo pipefail
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          for subnet in 169.254.0.0/16 100.100.100.200/32; do
            sudo -n iptables -w 5 -I OUTPUT 1 -d "$subnet" -j REJECT
            sudo -n iptables -w 5 -C OUTPUT -d "$subnet" -j REJECT
          done
          for subnet in fe80::/10 fc00::/7; do
            sudo -n ip6tables -w 5 -I OUTPUT 1 -d "$subnet" -j REJECT
            sudo -n ip6tables -w 5 -C OUTPUT -d "$subnet" -j REJECT
          done

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install pinned Flutter
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="$RUNNER_TEMP/ark-offline-flutter"
          git init "$sdk_dir"
          git -C "$sdk_dir" remote add origin https://github.com/flutter/flutter.git
          git -C "$sdk_dir" fetch --depth=1 origin refs/tags/3.47.6:refs/tags/3.47.6
          git -C "$sdk_dir" checkout --detach refs/tags/3.47.6
          test "$(git -C "$sdk_dir" rev-parse HEAD)" = 5fc346839b5d0eef006ed8404392afb4dfae428d
          echo "$sdk_dir/bin" >> "$GITHUB_PATH"
          "$sdk_dir/bin/flutter" config --no-analytics

      - name: Resolve locked dependencies
        working-directory: apps/frontend
        run: flutter pub get --enforce-lockfile

      - name: Lockfile unchanged
        run: git diff --exit-code -- apps/frontend/pubspec.lock

      - name: Analyze ARK Environment status surface
        working-directory: apps/frontend
        run: >-
          flutter analyze --no-fatal-infos --no-fatal-warnings
          lib/environment/environment_state.dart
          lib/environment/environment_adapter.dart
          lib/environment/attention_status.dart
          lib/environment/objective_strip.dart
          test/environment_adapter_test.dart
          test/environment_state_test.dart
          test/environment_live_ark_test.dart
          test/environment_shared_canary_fixture_test.dart

      - name: Targeted ARK Environment tests
        working-directory: apps/frontend
        run: >-
          timeout 180s flutter test --reporter expanded --concurrency=1
          test/environment_adapter_test.dart
          test/environment_state_test.dart
          test/environment_live_ark_test.dart
          test/environment_shared_canary_fixture_test.dart

      - name: Full Flutter regression suite
        working-directory: apps/frontend
        run: timeout 360s flutter test --reporter expanded

      - name: Compile synthetic Grove APK
        working-directory: apps/frontend
        run: >-
          timeout 600s flutter build apk --debug --flavor grove
          --dart-define=GROVE_STANDALONE=true
          --dart-define=GROVE_PRIVATE_TALK_PREVIEW=true
          --dart-define=GROVE_PRIVATE_NEW_CONVERSATION_PREVIEW=false
          --dart-define=GROVE_SUPABASE_URL=https://fqjqpuaoifgbweiguacf.supabase.co
          --dart-define=GROVE_SUPABASE_ANON_KEY=sb_publishable_synthetic_ci_only
          --dart-define=GROVE_API_URL=https://ci-grove-api.example.invalid

      - name: Verify synthetic build exists
        working-directory: apps/frontend
        run: test -s build/app/outputs/flutter-apk/app-grove-debug.apk

