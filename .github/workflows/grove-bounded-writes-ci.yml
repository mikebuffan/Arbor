name: Grove bounded writes integrated source acceptance
'on':
  pull_request:
    branches:
    - arbor/grove-buffalo-source-20261006
    types:
    - opened
    - synchronize
    - reopened
permissions:
  contents: read
concurrency:
  group: grove-bounded-writes-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  phone-source:
    if: github.repository == 'mikebuffan/Arbor' && github.head_ref == 'arbor/grove-bounded-writes-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
    - name: Block metadata before checkout or SDK bootstrap; fail closed
      shell: bash
      run: |
        set -euo pipefail
        # Workflow env keys are case-insensitive. Clear both OS spellings at
        # runtime instead of declaring duplicate YAML environment keys.
        unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
        for proxy_var in HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy; do
          printf '%s=\n' "$proxy_var" >> "$GITHUB_ENV"
        done
        for subnet in 169.254.0.0/16 100.100.100.200/32; do
          sudo -n iptables -w 5 -I OUTPUT 1 -d "$subnet" -j REJECT
          sudo -n iptables -w 5 -C OUTPUT -d "$subnet" -j REJECT
        done
        for subnet in fe80::/10 fc00::/7; do
          sudo -n ip6tables -w 5 -I OUTPUT 1 -d "$subnet" -j REJECT
          sudo -n ip6tables -w 5 -C OUTPUT -d "$subnet" -j REJECT
        done
        # Inspect installed rules only; never probe any metadata endpoint.
        printf 'Metadata deny rules installed and verified.\n'
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Install pinned public Flutter source in disposable runner
      shell: bash
      run: |
        set -euo pipefail
        sdk_dir="$RUNNER_TEMP/grove-flutter"
        git init "$sdk_dir"
        git -C "$sdk_dir" remote add origin https://github.com/flutter/flutter.git
        git -C "$sdk_dir" fetch --depth=1 origin refs/tags/3.47.6:refs/tags/3.47.6
        git -C "$sdk_dir" checkout --detach refs/tags/3.47.6
        test "$(git -C "$sdk_dir" rev-parse HEAD)" = 5fc346839b5d0eef006ed8404392afb4dfae428d
        echo "$sdk_dir/bin" >> "$GITHUB_PATH"
        "$sdk_dir/bin/flutter" config --no-analytics
        "$sdk_dir/bin/flutter" --version
    - name: Resolve only locked app dependencies
      working-directory: apps/frontend
      run: flutter pub get --enforce-lockfile
    - name: Verify lockfile is unchanged
      run: git diff --exit-code -- apps/frontend/pubspec.lock
    - name: Analyze shared Text/Voice and private phone source
      working-directory: apps/frontend
      run: flutter analyze --no-fatal-infos --no-fatal-warnings
    - name: Run restart, storage-failure, scope and retry fixtures
      working-directory: apps/frontend
      run: timeout 180s flutter test --reporter expanded --concurrency=1 test/arbor_session_test.dart test/grove_pending_turn_store_test.dart
        test/grove_private_text_page_test.dart test/grove_private_conversations_test.dart
    - name: Run complete existing Flutter regression suite
      working-directory: apps/frontend
      run: timeout 360s flutter test --reporter expanded
    - name: Compile synthetic Grove APK; never deploy or install
      working-directory: apps/frontend
      run: timeout 600s flutter build apk --debug --flavor grove --dart-define=GROVE_STANDALONE=true --dart-define=GROVE_PRIVATE_TALK_PREVIEW=true
        --dart-define=GROVE_PRIVATE_NEW_CONVERSATION_PREVIEW=false --dart-define=GROVE_SUPABASE_URL=https://fqjqpuaoifgbweiguacf.supabase.co
        --dart-define=GROVE_SUPABASE_ANON_KEY=sb_publishable_synthetic_ci_only --dart-define=GROVE_API_URL=https://ci-grove-api.example.invalid
    - name: Verify synthetic build exists; no artifact publication
      working-directory: apps/frontend
      run: test -s build/app/outputs/flutter-apk/app-grove-debug.apk
  native-storage:
    if: github.repository == 'mikebuffan/Arbor' && github.head_ref == 'arbor/grove-bounded-writes-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
    - name: Block metadata before checkout or SDK bootstrap; fail closed
      shell: bash
      run: |
        set -euo pipefail
        # Workflow env keys are case-insensitive. Clear both OS spellings at
        # runtime instead of declaring duplicate YAML environment keys.
        unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
        for proxy_var in HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy; do
          printf '%s=\n' "$proxy_var" >> "$GITHUB_ENV"
        done
        for subnet in 169.254.0.0/16 100.100.100.200/32; do
          sudo -n iptables -w 5 -I OUTPUT 1 -d "$subnet" -j REJECT
          sudo -n iptables -w 5 -C OUTPUT -d "$subnet" -j REJECT
        done
        for subnet in fe80::/10 fc00::/7; do
          sudo -n ip6tables -w 5 -I OUTPUT 1 -d "$subnet" -j REJECT
          sudo -n ip6tables -w 5 -C OUTPUT -d "$subnet" -j REJECT
        done
        # Inspect installed rules only; never probe any metadata endpoint.
        printf 'Metadata deny rules installed and verified.\n'
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Start disposable native PostgreSQL; local socket only
      shell: bash
      run: |-
        set -euo pipefail
        pg_bin=/usr/lib/postgresql/16/bin
        test -x "$pg_bin/initdb"
        pg_root="/tmp/grove-native-${GITHUB_RUN_ID}"
        mkdir -p "$pg_root/data" "$pg_root/socket"
        sudo -n chown -R postgres:postgres "$pg_root"
        sudo -n -u postgres "$pg_bin/initdb" -D "$pg_root/data" --auth=trust --no-locale
        sudo -n -u postgres "$pg_bin/pg_ctl" -D "$pg_root/data" -l "$pg_root/server.log" -o "-k $pg_root/socket -p 54329 -c listen_addresses=''" -w start
        printf 'PGHOST=%s/socket
        PGPORT=54329
        PGUSER=postgres
        PGDATABASE=grove_disposable
        ' "$pg_root" >> "$GITHUB_ENV"
        echo "$pg_bin" >> "$GITHUB_PATH"
        "$pg_bin/createdb" -h "$pg_root/socket" -p 54329 -U postgres grove_disposable
    - name: Apply exact proposals in disposable fixture only
      run: |-
        psql -X -v ON_ERROR_STOP=1 -f ops/grove/disposable-db/00-private-transcript-acceptance.sql
        psql -X -v ON_ERROR_STOP=1 -f ops/grove/disposable-db/correction-grants-acceptance.sql
    - name: Twelve native claim/completion/revocation sessions
      run: python3 ops/grove/disposable-db/native-claims.py --disposable-local
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install locked source dependencies
      run: |-
        corepack enable
        corepack prepare pnpm@10.30.3 --activate
        pnpm install --frozen-lockfile
    - name: Actual durable writer against independent native PostgreSQL sessions
      working-directory: apps/backend
      run: node_modules/.bin/tsx ../../ops/grove/disposable-db/native-durable-corrections.mts --disposable-local
    - name: Stop disposable PostgreSQL
      if: always()
      run: |-
        pg_root="/tmp/grove-native-${GITHUB_RUN_ID}"
        if test -f "$pg_root/data/postmaster.pid"; then
         sudo -n -u postgres /usr/lib/postgresql/16/bin/pg_ctl -D "$pg_root/data" -m immediate -w stop
        fi
