name: Capability hypothesis source acceptance

on:
  push:
    branches:
      - verification/capability-hypothesis-acceptance-20261006
  pull_request:
    branches:
      - feature/capability-hypothesis-layer-20261006

permissions:
  contents: read

jobs:
  backend:
    if: github.repository == 'mikebuffan/Arbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
      AWS_EC2_METADATA_DISABLED: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm install --frozen-lockfile
      - name: Install inherited PDF tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Capability hypothesis focused tests
        working-directory: apps/backend
        run: >
          pnpm exec vitest run
          lib/arbor/selfModel/__tests__/capabilityHypotheses.test.ts
      - name: Guard source-only migration proposal
        run: |
          test -f docs/migrations/20261006_extend_capability_registry_hypotheses.sql
          ! git diff --exit-code integration/one-arbor-pre-vercel-20261006...HEAD -- supabase/migrations >/dev/null || true
          test ! -f supabase/migrations/20261006_extend_capability_registry_hypotheses.sql
      - name: Standalone TypeScript
        working-directory: apps/backend
        run: pnpm exec tsc --noEmit
      - name: Production backend build
        working-directory: apps/backend
        run: pnpm build
