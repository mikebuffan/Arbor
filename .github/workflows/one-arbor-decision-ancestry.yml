name: One Arbor decision ancestry source acceptance

on:
  pull_request:
    branches:
      - integration/one-arbor-multilane-20261007
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/backend/lib/arbor/runtime/decisionAncestry.ts'
      - 'apps/backend/lib/arbor/runtime/__tests__/decisionAncestry.test.ts'
      - 'apps/backend/lib/arbor/runtime/decisionReviewAdapter.ts'
      - 'apps/backend/lib/arbor/runtime/__tests__/decisionReviewAdapter.test.ts'
      - 'apps/backend/lib/arbor/runtime/discoveryRadar.ts'
      - 'apps/backend/lib/arbor/runtime/__tests__/discoveryRadar.test.ts lib/arbor/continuity/__tests__/longitudinalShorthand.integration.test.ts'
      - 'apps/backend/lib/arbor/continuity/longitudinalPolicy.ts'
      - 'apps/backend/lib/arbor/agency/session.ts'
      - 'apps/backend/lib/arbor/continuity/__tests__/longitudinalShorthand.integration.test.ts'
      - '.github/workflows/one-arbor-decision-ancestry.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arbor-decision-ancestry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bounded-source-acceptance:
    if: github.repository == 'mikebuffan/Arbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      AWS_EC2_METADATA_DISABLED: 'true'
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm install --frozen-lockfile
      - name: Read-only decision history tests
        working-directory: apps/backend
        run: pnpm exec vitest run lib/arbor/runtime/__tests__/decisionAncestry.test.ts lib/arbor/runtime/__tests__/decisionReviewAdapter.test.ts lib/arbor/runtime/__tests__/discoveryRadar.test.ts
      - name: Existing agency and continuity regression
        working-directory: apps/backend
        run: pnpm exec vitest run lib/arbor/agency/__tests__ lib/arbor/continuity/__tests__
      - name: Verify Poppler for existing PDF tests
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null; then
            timeout 120s sudo apt-get update
            timeout 120s sudo apt-get install -y poppler-utils
          fi
          pdfinfo -v
          pdftotext -v
      - name: Full backend regression
        run: pnpm --filter firefly-backend test
      - name: Standalone TypeScript
        working-directory: apps/backend
        run: pnpm exec tsc --noEmit
