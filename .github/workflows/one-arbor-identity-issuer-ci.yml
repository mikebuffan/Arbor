name: One Arbor verified boundary receipt and chat source acceptance

on:
  push:
    branches:
      - fix/batch20-identity-issuer-gate-20261009
      - fix/chat-safe-batch-followthrough-20261009
      - fix/chat-boundary-pending-receipts-20261009
      - fix/one-arbor-97-unlock-review-20261009
      - fix/one-arbor-github-run-discovery-20261009
      - fix/cross-round-receipt-retention-20261009
      - fix/unlock-c08-correction-count-20261009
      - fix/d12-unverified-score-20261009
      - fix/one-arbor-exact-grove-continuity-20261009

permissions:
  contents: read

concurrency:
  group: one-arbor-identity-issuer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity-security:
    if: github.repository == 'mikebuffan/Arbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 223 retained source fingerprints
        run: node ops/integration/verify-one-arbor-composition.mjs
      - name: Verify review branch can never trigger Vercel build
        run: node --test ops/grove/source-only-ignore.test.mjs
      - name: Evaluate existing 97-task unlock candidates (read only)
        run: |
          node --test ops/integration/__tests__/one-arbor-unlock-review.test.mjs
          node ops/integration/one-arbor-unlock-review.mjs > /tmp/one-arbor-unlock-flags.json
          node -e 'const r=require("/tmp/one-arbor-unlock-flags.json"); console.log("ONE ARBOR REVIEW: "+r.originalTaskCount+" original tasks; "+r.flaggedTasks.length+" reassessment flags; "+r.actionsStarted.length+" actions started");'
      - name: Resolve locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm install --frozen-lockfile
      - name: Verify identity issuer negative and positive controls
        working-directory: apps/backend
        run: >-
          pnpm exec vitest run
          lib/arbor/security/__tests__/identityAssurance.test.ts
          lib/arbor/security/__tests__/identityAssuranceExtensions.test.ts
          lib/arbor/agency/__tests__/engineResume.test.ts
          lib/arbor/agency/__tests__/independentFollowthrough.test.ts
          lib/arbor/agency/__tests__/tools.test.ts
          lib/chat/__tests__/chatCorrectionDurability.test.ts
          lib/arbor/runtime/__tests__/correctionPromotion.test.ts
          lib/arbor/agency/__tests__/selfUpdateController.test.ts
          lib/arbor/agency/__tests__/updateLifecycle.test.ts
          lib/arbor/runtime/__tests__/runtimeStateStore.test.ts
          lib/arbor/behavior/__tests__/arkLayerReadContext.test.ts
          lib/grove/__tests__/privateConversationLoop.test.ts
          lib/grove/__tests__/arkSpineContinuity.test.ts
          lib/arbor/host/__tests__/oneArborAcceptance.test.ts
      - name: Type-check existing backend
        working-directory: apps/backend
        run: pnpm exec tsc --noEmit
      - name: Install local PDF regression dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdfinfo -v
          pdftotext -v
      - name: Full backend regression
        run: pnpm --filter firefly-backend test
      - name: Production backend build
        run: pnpm --filter firefly-backend build

  unlock-receipt-discovery:
    name: Read-only GitHub receipt discovery
    needs: identity-security
    if: github.repository == 'mikebuffan/Arbor' && needs.identity-security.result == 'success'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify GitHub receipt discovery negative controls
        run: node --test ops/integration/__tests__/one-arbor-github-run-discovery.test.mjs
      - name: Read exact successful GitHub CI receipts and emit reassessment only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node ops/integration/one-arbor-github-run-discovery.mjs > one-arbor-unlock-review.json
          node -e 'const r=require("./one-arbor-unlock-review.json"); console.log("Verified source events: "+r.verifiedReceiptEvents+"; review flags: "+r.review.flaggedTasks.length+"; actions: "+r.review.actionsStarted.length+"; not yet verified: "+r.notYetVerified.length)'
      - name: Preserve bounded review artifact
        uses: actions/upload-artifact@v4
        with:
          name: one-arbor-unlock-review
          path: one-arbor-unlock-review.json
          if-no-files-found: error
          retention-days: 7
