name: One Arbor identity and independent chat continuation source acceptance

on:
  push:
    branches:
      - fix/batch20-identity-issuer-gate-20261009
      - fix/chat-safe-batch-followthrough-20261009

permissions:
  contents: read

concurrency:
  group: one-arbor-identity-issuer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity-security:
    if: github.repository == 'mikebuffan/Arbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 223 retained source fingerprints
        run: node ops/integration/verify-one-arbor-composition.mjs
      - name: Verify review branch can never trigger Vercel build
        run: node --test ops/grove/source-only-ignore.test.mjs
      - name: Resolve locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm install --frozen-lockfile
      - name: Verify identity issuer negative and positive controls
        working-directory: apps/backend
        run: >-
          pnpm exec vitest run
          lib/arbor/security/__tests__/identityAssurance.test.ts
          lib/arbor/security/__tests__/identityAssuranceExtensions.test.ts
          lib/arbor/agency/__tests__/engineResume.test.ts
          lib/arbor/agency/__tests__/independentFollowthrough.test.ts
      - name: Type-check existing backend
        working-directory: apps/backend
        run: pnpm exec tsc --noEmit
      - name: Install local PDF regression dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdfinfo -v
          pdftotext -v
      - name: Full backend regression
        run: pnpm --filter firefly-backend test
      - name: Production backend build
        run: pnpm --filter firefly-backend build
