name: One Arbor Group 06 self-model evidence boundaries
on:
  pull_request:
    branches:
      - integration/one-arbor-reconciled-335-339-20261007
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/arbor-control-backend/src/selfModel*.ts'
      - 'apps/backend/lib/arbor/selfModel/**'
      - 'docs/integration/ONE_ARBOR_GROUP06_IDENTITY_EVIDENCE_GATE_20261007.md'
      - 'ops/grove/source-only-ignore.mjs'
      - '.github/workflows/one-arbor-group6-self-model.yml'
permissions:
  contents: read
concurrency:
  group: one-arbor-group06-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source-contracts:
    if: github.repository == 'mikebuffan/Arbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      AWS_EC2_METADATA_DISABLED: 'true'
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm install --frozen-lockfile
      - name: Self-model provenance, corrections and claims
        working-directory: apps/arbor-control-backend
        run: >-
          pnpm exec vitest run
          src/selfModelState.test.ts
          src/selfModelObservations.test.ts
          src/selfModelClaims.test.ts
          src/selfModelEvidenceBoundaries.test.ts
          src/selfModel1000Projection.test.ts
          src/selfModel1000Rebuild.test.ts
          src/selfModelRebuild.test.ts
      - name: Control-backend TypeScript build
        run: pnpm --filter arbor-control-backend build
      - name: Canonical backend prompt and startup negatives
        working-directory: apps/backend
        run: >-
          pnpm exec vitest run
          lib/arbor/selfModel/__tests__/group06EpistemicBoundaries.test.ts
          lib/arbor/selfModel/__tests__/personalityProjection.test.ts
          lib/arbor/host/__tests__/oneArborHostBridge.test.ts
      - name: Backend TypeScript
        working-directory: apps/backend
        run: pnpm exec tsc --noEmit
