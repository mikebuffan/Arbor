name: Arbor Integration CI

on:
  pull_request:
    branches:
      - main
      - arbor-linear-runtime
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arbor-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: corepack prepare pnpm@10.30.3 --activate
      - run: pnpm install --frozen-lockfile

      - name: Run backend tests
        env:
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
        run: pnpm --filter firefly-backend test

      - name: Build backend
        env:
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
        run: pnpm --filter firefly-backend build

  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Sync generated Flutter state for Voice
        if: >
          github.head_ref == 'arbor-live-voice-ui' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- pubspec.lock analysis_options.yaml; then
            exit 0
          fi

          cp pubspec.lock /tmp/arbor-pubspec.lock
          cp analysis_options.yaml /tmp/arbor-analysis-options.yaml
          cd ../..

          git fetch origin arbor-live-voice-ui
          git checkout -B arbor-live-voice-ui origin/arbor-live-voice-ui

          cp /tmp/arbor-pubspec.lock apps/frontend/pubspec.lock
          cp /tmp/arbor-analysis-options.yaml apps/frontend/analysis_options.yaml

          git config user.name "Arbor CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/frontend/pubspec.lock apps/frontend/analysis_options.yaml
          git commit -m "chore(flutter): refresh generated dependency state"
          git push origin HEAD:arbor-live-voice-ui

      - name: Verify Flutter generated state is current
        run: git diff --exit-code -- pubspec.lock analysis_options.yaml

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test
