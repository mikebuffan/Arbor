name: Arbor Integration CI

on:
  pull_request:
    branches:
      - main
      - arbor-linear-runtime
  workflow_dispatch:

concurrency:
  group: arbor-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: corepack prepare pnpm@10.30.3 --activate
      - run: pnpm install --frozen-lockfile

      - name: Run backend tests
        env:
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
        run: pnpm --filter firefly-backend test

      - name: Build backend
        env:
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
        run: pnpm --filter firefly-backend build

  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Verify Flutter generated state is current
        run: git diff --exit-code -- pubspec.lock analysis_options.yaml

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

  behavior_guard_sync:
    name: Wire behavior guard
    if: github.head_ref == 'arbor-behavior-regression-guard'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: arbor-behavior-regression-guard

      - name: Apply exact behavior-guard wiring
        run: python .github/scripts/wire_behavior_guard.py

      - name: Commit wiring
        run: |
          git add \
            apps/backend/lib/arbor/agency/openaiAgent.ts \
            apps/backend/lib/arbor/agency/__tests__/updateLifecycle.test.ts \
            apps/backend/lib/prompt/buildPromptContext.ts \
            apps/backend/app/api/chat/route.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "Arbor CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(agency): wire behavioral regressions into self-update"
          git push origin HEAD:arbor-behavior-regression-guard
