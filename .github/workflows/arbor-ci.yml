name: Arbor Integration CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - arbor-linear-runtime
      # Temporary stacked research review CI. Remove before main integration.
      - feat/ark-research-session-timebox-20260920
      # Temporary sandbox PDF test branch; remove before main integration.
      - feat/ark-research-observation-bridge-20260921
      # Temporary stacked identity review target; remove before main merge.
      - feat/ark-pdf-sandbox-threat-model-20260921
      # Temporary evidence-stage review target; remove before main merge.
      - feat/ark-source-version-identity-20260921
      # Temporary outcome-receipt review target; remove before main merge.
      - feat/ark-evidence-stage-contract-20260921
      # Temporary PDF batch-plan review target; remove before main merge.
      - feat/ark-research-outcome-receipts-20260921
      # Temporary page-image provenance review target; remove before main integration.
      - feat/ark-pdf-batch-plan-20260921
      # Temporary disposable renderer sandbox review target; remove before main integration.
      - feat/ark-pdf-page-image-provenance-20260921
      # Temporary evidence-backed completion review target; remove before main integration.
      - feat/ark-pdf-disposable-sandbox-20260921
      # Temporary lead-dedupe review target; remove before main integration.
      - feat/ark-evidence-completion-verification-20260922
  workflow_dispatch:

# CI sentinel: keep this workflow visibly updated when main-push Actions delivery stalls.

concurrency:
  group: arbor-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.30.3 --activate
      - run: pnpm install --frozen-lockfile
      - name: Ensure sandbox Poppler parser tools for harmless PDF fixtures
        run: |
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null || ! command -v pdfimages >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
      - name: Run backend tests
        env:
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
        run: pnpm --filter firefly-backend test
      - name: Build backend
        env:
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
        run: pnpm --filter firefly-backend build

  pdf-sandbox:
    name: Disposable PDF sandbox smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build digest-pinned non-root Poppler image
        run: |
          docker build -t arbor-pdf-sandbox:ci ops/research/pdf-sandbox
          test "$(docker image inspect --format '{{.Config.User}}' arbor-pdf-sandbox:ci)" = "65532:65532"
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' arbor-pdf-sandbox:ci)"
          [[ "$IMAGE_ID" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "PDF_SANDBOX_IMAGE_REF=$IMAGE_ID" >> "$GITHUB_ENV"
      - name: Render harmless synthetic fixture under hard isolation
        run: |
          mkdir -p "$RUNNER_TEMP/pdf-sandbox-out"
          chmod 0777 "$RUNNER_TEMP/pdf-sandbox-out"
          node ops/research/pdf-sandbox/make-harmless-fixture.mjs "$RUNNER_TEMP/harmless.pdf"
          chmod 0444 "$RUNNER_TEMP/harmless.pdf"
          bash ops/research/pdf-sandbox/run.sh "$RUNNER_TEMP/harmless.pdf" "$RUNNER_TEMP/pdf-sandbox-out"
          test -s "$RUNNER_TEMP/pdf-sandbox-out/page-1.png"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("${{ runner.temp }}/pdf-sandbox-out/page-1.png")
          assert p.read_bytes()[:8] == b"\x89PNG\r\n\x1a\n"
          PY

  external-benign-pdf:
    name: External blank IRS PDF acceptance (no private data)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install harmless PDF inspection tools
        run: |
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
      - name: Fetch independently published blank 2025 IRS form
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --max-redirs 3 --connect-timeout 10 --max-time 45 --retry 2 \
            --output "$RUNNER_TEMP/blank-1040.pdf" \
            --write-out 'HTTP=%{http_code} content_type=%{content_type} bytes=%{size_download} final_url=%{url_effective}\n' \
            'https://www.irs.gov/pub/irs-prior/f1040--2025.pdf'
          test "$(head -c 5 "$RUNNER_TEMP/blank-1040.pdf")" = '%PDF-'
          test "$(wc -c < "$RUNNER_TEMP/blank-1040.pdf")" -le 5242880
          sha256sum "$RUNNER_TEMP/blank-1040.pdf"
          pdfinfo "$RUNNER_TEMP/blank-1040.pdf" | grep -E '^Pages:[[:space:]]+2$'
          pdftotext -f 1 -l 1 -layout "$RUNNER_TEMP/blank-1040.pdf" "$RUNNER_TEMP/first.txt"
          pdftotext -f 2 -l 2 -layout "$RUNNER_TEMP/blank-1040.pdf" "$RUNNER_TEMP/second.txt"
          test -s "$RUNNER_TEMP/first.txt"
          test -s "$RUNNER_TEMP/second.txt"
          ! cmp -s "$RUNNER_TEMP/first.txt" "$RUNNER_TEMP/second.txt"
          echo 'Page 1 text SHA256:'
          sha256sum "$RUNNER_TEMP/first.txt"
          echo 'Page 2 text SHA256:'
          sha256sum "$RUNNER_TEMP/second.txt"
          echo 'TWO_PAGE_TEXT_SEPARATION=PASS; LINE_BOUNDARY_MANUAL_REVIEW=HOLD'
      - name: Render downloaded public form under existing isolated sandbox
        shell: bash
        run: |
          set -euo pipefail
          docker build -t arbor-pdf-sandbox:external ops/research/pdf-sandbox
          PDF_SANDBOX_IMAGE_REF="$(docker image inspect --format '{{.Id}}' arbor-pdf-sandbox:external)"
          export PDF_SANDBOX_IMAGE_REF
          [[ "$PDF_SANDBOX_IMAGE_REF" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/external-pdf-out"
          chmod 0777 "$RUNNER_TEMP/external-pdf-out"
          chmod 0444 "$RUNNER_TEMP/blank-1040.pdf"
          bash ops/research/pdf-sandbox/run.sh "$RUNNER_TEMP/blank-1040.pdf" "$RUNNER_TEMP/external-pdf-out"
          test -s "$RUNNER_TEMP/external-pdf-out/page-1.png"
          echo 'EXTERNAL_BENIGN_PDF_ACCEPTANCE=PASS (page 1 sandbox rendering; 2-page text boundaries)'

  disposable-research-db:
    name: Disposable synthetic PostgreSQL research RPC acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: arbor_synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arbor_synthetic"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-only
      PGDATABASE: arbor_synthetic
    steps:
      - uses: actions/checkout@v4
      - name: Apply synthetic auth/project fixture to ephemeral CI container
        run: psql -v ON_ERROR_STOP=1 -f ops/research/disposable-db/00-fixture.sql
      - name: Apply proposed research SQL to disposable container ONLY
        run: psql -v ON_ERROR_STOP=1 -f docs/research/sql/PROPOSED_arbor_research_sessions.sql
      - name: Exercise claim, settlement, idempotency, owner RLS and STOP
        run: psql -v ON_ERROR_STOP=1 -f ops/research/disposable-db/10-acceptance.sql
      - name: Exercise deadline, expiry, fencing, STOP and revocation boundaries
        run: psql -v ON_ERROR_STOP=1 -f ops/research/disposable-db/20-boundaries.sql
      - name: Race independent PostgreSQL connections for claim and settlement
        run: bash ops/research/disposable-db/30-concurrency.sh
      - name: Verify lock-wait deadline and lease-expiry fences
        run: bash ops/research/disposable-db/40-lock-waits.sh
      - name: Race STOP against settlement in independent connections
        run: bash ops/research/disposable-db/50-stop-race.sh
      - name: Exercise attempt cap, failure receipts and stalled lease recovery
        run: psql -v ON_ERROR_STOP=1 -f ops/research/disposable-db/60-attempt-failure-stall.sql

  control-backend:
    name: Control backend test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: corepack prepare pnpm@10.30.3 --activate
      - run: pnpm install --frozen-lockfile
      - name: Run control backend tests
        run: pnpm --filter arbor-control-backend test
      - name: Build control backend
        run: pnpm --filter arbor-control-backend build

  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify Flutter generated state is current
        run: git diff --exit-code -- pubspec.lock analysis_options.yaml
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Build Android debug APK
        run: >
          flutter build apk --debug
          --dart-define=SUPABASE_URL=https://ncpdlyakrzfvobmwzbon.supabase.co
          --dart-define=SUPABASE_ANON_KEY=sb_publishable_med7aHx1vGlYLih1QbdgtA_zQnRTSrS
          --dart-define=ARBOR_API_URL=https://firefly-coral.vercel.app
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arbor-android-debug
          path: apps/frontend/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7