name: Arbor Integration CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - arbor-linear-runtime
      - "arbor/**"
  workflow_dispatch:

# CI sentinel: keep this workflow visibly updated when main-push Actions delivery stalls.

concurrency:
  group: arbor-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: corepack prepare pnpm@10.30.3 --activate
      - run: pnpm install --frozen-lockfile

      - name: Run backend tests
        env:
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
        run: pnpm --filter firefly-backend test

      - name: Build backend
        env:
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
        run: pnpm --filter firefly-backend build

  control-backend:
    name: Control backend test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: corepack enable
      - run: corepack prepare pnpm@10.30.3 --activate
      - run: pnpm install --frozen-lockfile

      - name: Run control backend tests
        run: pnpm --filter arbor-control-backend test

      - name: Build control backend
        run: pnpm --filter arbor-control-backend build

  investigation-schema:
    name: Investigation migration parse + apply
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arbor_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arbor_ci

    steps:
      - uses: actions/checkout@v4

      - name: Prepare minimal Supabase-compatible schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          create schema if not exists auth;
          create role authenticated nologin;
          create table auth.users (id uuid primary key default gen_random_uuid());
          create table public.projects (
            id uuid primary key default gen_random_uuid(),
            user_id uuid not null references auth.users(id)
          );
          create or replace function auth.uid()
          returns uuid
          language sql
          stable
          as $func$ select null::uuid $func$;
          SQL

      - name: Parse and apply investigation workbench migration
        run: >-
          psql "$DATABASE_URL"
          -v ON_ERROR_STOP=1
          -f supabase/migrations/20260918002000_arbor_investigation_workbench.sql

      - name: Verify RLS and immutable evidence triggers exist
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $verify$
          declare
            missing integer;
          begin
            select count(*) into missing
            from (
              values
                ('arbor_investigation_cases'),
                ('arbor_investigation_sources'),
                ('arbor_investigation_evidence_packets'),
                ('arbor_investigation_claims'),
                ('arbor_investigation_edges'),
                ('arbor_investigation_coverage'),
                ('arbor_investigation_hypotheses'),
                ('arbor_investigation_findings')
            ) expected(name)
            where not exists (
              select 1
              from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname = 'public'
                and c.relname = expected.name
                and c.relrowsecurity
            );

            if missing <> 0 then
              raise exception 'investigation RLS verification failed: % table(s)', missing;
            end if;

            if not exists (
              select 1 from pg_trigger
              where tgname = 'arbor_investigation_evidence_packets_immutable'
                and not tgisinternal
            ) then
              raise exception 'immutable evidence trigger missing';
            end if;

            if not exists (
              select 1 from pg_trigger
              where tgname = 'arbor_investigation_findings_guard'
                and not tgisinternal
            ) then
              raise exception 'finding lifecycle trigger missing';
            end if;
          end $verify$;
          SQL

  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Verify Flutter generated state is current
        run: git diff --exit-code -- pubspec.lock analysis_options.yaml

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test

      - name: Build Android debug APK
        run: >
          flutter build apk --debug
          --dart-define=SUPABASE_URL=https://ncpdlyakrzfvobmwzbon.supabase.co
          --dart-define=SUPABASE_ANON_KEY=sb_publishable_med7aHx1vGlYLih1QbdgtA_zQnRTSrS
          --dart-define=ARBOR_API_URL=https://firefly-coral.vercel.app

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arbor-android-debug
          path: apps/frontend/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
