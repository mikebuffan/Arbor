name: Arbor Integration CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - arbor-linear-runtime
  workflow_dispatch:

concurrency:
  group: arbor-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: corepack prepare pnpm@10.30.3 --activate
      - run: pnpm install --frozen-lockfile

      - name: Run backend tests
        env:
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
        run: pnpm --filter firefly-backend test

      - name: Run backend beta gate
        run: pnpm --filter firefly-backend test:beta-gate

      - name: Build backend
        env:
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
        run: pnpm --filter firefly-backend build

  control-backend:
    name: Control backend test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: corepack enable
      - run: corepack prepare pnpm@10.30.3 --activate
      - run: pnpm install --frozen-lockfile

      - name: Run control backend tests
        run: pnpm --filter arbor-control-backend test

      - name: Build control backend
        run: pnpm --filter arbor-control-backend build

  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Verify Flutter generated state is current
        run: git diff --exit-code -- pubspec.lock analysis_options.yaml

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test

      - name: Build Android debug APK
        run: >
          flutter build apk --debug
          --dart-define=SUPABASE_URL=https://ncpdlyakrzfvobmwzbon.supabase.co
          --dart-define=SUPABASE_ANON_KEY=sb_publishable_med7aHx1vGlYLih1QbdgtA_zQnRTSrS
          --dart-define=ARBOR_API_URL=https://firefly-coral.vercel.app

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arbor-android-debug
          path: apps/frontend/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
