name: Arbor Integration CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - arbor-linear-runtime
      # Temporary stacked research review CI. Remove before main integration.
      - feat/ark-research-session-timebox-20260920
      # Temporary sandbox PDF test branch; remove before main integration.
      - feat/ark-research-observation-bridge-20260921
      # Temporary stacked identity review target; remove before main merge.
      - feat/ark-pdf-sandbox-threat-model-20260921
      # Temporary evidence-stage review target; remove before main merge.
      - feat/ark-source-version-identity-20260921
      # Temporary outcome-receipt review target; remove before main merge.
      - feat/ark-evidence-stage-contract-20260921
  workflow_dispatch:

# CI sentinel: keep this workflow visibly updated when main-push Actions delivery stalls.

concurrency:
  group: arbor-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Install Poppler fixture parser dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Run backend tests
        working-directory: apps/backend
        run: npm test -- --run

      - name: Build backend
        working-directory: apps/backend
        run: npm run build

  control-backend:
    name: Control backend test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: arbor-control/backend/package-lock.json

      - name: Install control backend dependencies
        working-directory: arbor-control/backend
        run: npm ci

      - name: Run control backend tests
        working-directory: arbor-control/backend
        run: npm test -- --run

      - name: Build control backend
        working-directory: arbor-control/backend
        run: npm run build

  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: apps/flutter
        run: flutter pub get

      - name: Verify Flutter generated state is current
        working-directory: apps/flutter
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code

      - name: Analyze
        working-directory: apps/flutter
        run: flutter analyze

      - name: Test
        working-directory: apps/flutter
        run: flutter test

      - name: Build Android debug APK
        working-directory: apps/flutter
        run: flutter build apk --debug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arbor-android-debug
          path: apps/flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
