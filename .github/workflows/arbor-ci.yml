name: Arbor Integration CI

on:
  push:
    branches:
      - main
      # Temporary isolated integration-manifest v3 tests; remove before source promotion.
      - docs/arbor-master-integration-20260921
  pull_request:
    branches:
      - main
      - arbor-linear-runtime
  workflow_dispatch:

# CI sentinel: keep this workflow visibly updated when main-push Actions delivery stalls.

concurrency:
  group: arbor-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-item8-source-check:
    name: Pinned research item-8 workflow cleanup (offline; no research data)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Checkout the CURRENT integration tree, not the historical research
      # working tree with an unconfigured legacy 'flutter' gitlink. Read the
      # PINNED research Git objects without ever checking that tree out.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove exact research source commit and workflow cleanup
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 7179920ad35a0bc1a518631549e4af5d1f3da860^{commit}
          git show 7179920ad35a0bc1a518631549e4af5d1f3da860:.github/workflows/arbor-ci.yml > "$RUNNER_TEMP/research-pinned.yml"
          # #201 already passed backend and research synthetic CI. #207 MUST
          # change only workflow filters / own handoff, never research engine.
          git diff --name-only d74a107af8eeda30cb1b477bb9fee4122722679a 7179920ad35a0bc1a518631549e4af5d1f3da860 | sort > "$RUNNER_TEMP/research-changed.txt"
          printf '%s\n' '.github/workflows/arbor-ci.yml' 'docs/research/EPSTEIN_RESEARCH_ENGINE_HANDOFF_20260923_RUN10.md' | sort > "$RUNNER_TEMP/research-allowed.txt"
          diff -u "$RUNNER_TEMP/research-allowed.txt" "$RUNNER_TEMP/research-changed.txt"
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          import assert from "node:assert/strict";
          const src=readFileSync(process.env.RUNNER_TEMP+"/research-pinned.yml","utf8");
          assert.match(src,/pull_request:\s*\n\s*branches:\s*\n\s*- main\s*\n\s*- arbor-linear-runtime\s*\n/);
          assert.match(src,/push:\s*\n\s*branches:\s*\n\s*- main\s*\n/);
          const block=src.split("pull_request:")[1].split("workflow_dispatch:")[0];
          const targets=[...block.matchAll(/^\s+- ([^\s#]+)\s*$/gm)].map(m=>m[1]);
          assert.deepEqual(targets,["main","arbor-linear-runtime"]);
          assert.ok(!src.includes("Temporary stacked research review CI"));
          console.log("PASS: exact PR #207 research item 8 workflow cleanup, no ingestion, no merge or deploy");
          NODE

  backend:
    name: Backend test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: corepack prepare pnpm@10.30.3 --activate
      - run: pnpm install --frozen-lockfile

      - name: Run backend tests
        env:
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
        run: pnpm --filter firefly-backend test

      - name: Verify current integration inventory and negative gates (offline snapshot)
        run: |
          node --test docs/integration/check_integration_v3.test.mjs
          node docs/integration/check_integration_v3.mjs docs/integration/integration_manifest_v3.json

      - name: Build backend
        env:
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
        run: pnpm --filter firefly-backend build

  control-backend:
    name: Control backend test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: corepack enable
      - run: corepack prepare pnpm@10.30.3 --activate
      - run: pnpm install --frozen-lockfile

      - name: Run control backend tests
        run: pnpm --filter arbor-control-backend test

      - name: Build control backend
        run: pnpm --filter arbor-control-backend build

  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Verify Flutter generated state is current
        run: git diff --exit-code -- pubspec.lock analysis_options.yaml

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test

      - name: Build Android debug APK
        run: >
          flutter build apk --debug
          --dart-define=SUPABASE_URL=https://ncpdlyakrzfvobmwzbon.supabase.co
          --dart-define=SUPABASE_ANON_KEY=sb_publishable_med7aHx1vGlYLih1QbdgtA_zQnRTSrS
          --dart-define=ARBOR_API_URL=https://firefly-coral.vercel.app

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arbor-android-debug
          path: apps/frontend/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
