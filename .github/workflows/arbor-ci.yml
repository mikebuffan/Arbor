name: Arbor CI

on:
  pull_request:
    branches:
      - main
      - arbor-linear-runtime
  workflow_dispatch:

concurrency:
  group: arbor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Activate repo pnpm
        run: corepack prepare pnpm@10.30.3 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend tests
        run: pnpm --filter firefly-backend test

      - name: Build backend
        run: pnpm --filter firefly-backend build

  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
