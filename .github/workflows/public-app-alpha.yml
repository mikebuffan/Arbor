name: Public Arbor Alpha (Isolated)

on:
  pull_request:
    branches:
      - main
      - integration/one-arbor-current-20261006
    paths:
      - "apps/frontend/lib/public/**"
      - "apps/frontend/test/public_alpha_config_test.dart"
      - "apps/frontend/android/app/build.gradle.kts"
      - "apps/frontend/android/app/src/main/AndroidManifest.xml"
      - "apps/backend/lib/publicApp/**"
      - "apps/backend/app/api/public/**"
      - "apps/backend/middleware.ts"
      - "supabase/public-app/**"
      - "services/public-arbor-lm/**"
      - ".github/workflows/public-app-alpha.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-arbor-alpha-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-public-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Block metadata before checkout
        shell: bash
        run: |
          set -euo pipefail
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          for subnet in 169.254.0.0/16 100.100.100.200/32; do
            sudo -n iptables -w 5 -I OUTPUT 1 -d "$subnet" -j REJECT
            sudo -n iptables -w 5 -C OUTPUT -d "$subnet" -j REJECT
          done
          for subnet in fe80::/10 fc00::/7; do
            sudo -n ip6tables -w 5 -I OUTPUT 1 -d "$subnet" -j REJECT
            sudo -n ip6tables -w 5 -C OUTPUT -d "$subnet" -j REJECT
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm install --frozen-lockfile
      - name: Public backend contracts
        working-directory: apps/backend
        run: >
          pnpm exec vitest run
          lib/publicApp/__tests__/alphaAuth.test.ts
          lib/publicApp/__tests__/arborLM.test.ts
          lib/publicApp/__tests__/chatRoute.test.ts
          lib/publicApp/__tests__/conversationRoutes.test.ts
      - name: Standalone TypeScript
        working-directory: apps/backend
        run: pnpm exec tsc --noEmit
      - name: Production backend build
        run: pnpm --filter firefly-backend build

  inference-gateway-syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile public inference gateway
        run: python -m compileall -q services/public-arbor-lm

  public-flutter-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      DART_SUPPRESS_ANALYTICS: "true"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Block metadata before checkout
        shell: bash
        run: |
          set -euo pipefail
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          for subnet in 169.254.0.0/16 100.100.100.200/32; do
            sudo -n iptables -w 5 -I OUTPUT 1 -d "$subnet" -j REJECT
            sudo -n iptables -w 5 -C OUTPUT -d "$subnet" -j REJECT
          done
          for subnet in fe80::/10 fc00::/7; do
            sudo -n ip6tables -w 5 -I OUTPUT 1 -d "$subnet" -j REJECT
            sudo -n ip6tables -w 5 -C OUTPUT -d "$subnet" -j REJECT
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Flutter
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="$RUNNER_TEMP/public-arbor-flutter"
          git init "$sdk_dir"
          git -C "$sdk_dir" remote add origin https://github.com/flutter/flutter.git
          git -C "$sdk_dir" fetch --depth=1 origin refs/tags/3.47.6:refs/tags/3.47.6
          git -C "$sdk_dir" checkout --detach refs/tags/3.47.6
          test "$(git -C "$sdk_dir" rev-parse HEAD)" = 5fc346839b5d0eef006ed8404392afb4dfae428d
          echo "$sdk_dir/bin" >> "$GITHUB_PATH"
          "$sdk_dir/bin/flutter" config --no-analytics
      - name: Resolve locked Flutter dependencies
        working-directory: apps/frontend
        run: flutter pub get --enforce-lockfile
      - name: Lockfile unchanged
        run: git diff --exit-code -- apps/frontend/pubspec.lock
      - name: Public configuration tests
        working-directory: apps/frontend
        run: flutter test --reporter expanded test/public_alpha_config_test.dart
      - name: Analyze public entry point
        working-directory: apps/frontend
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/public
      - name: Compile isolated public Android debug entry point
        working-directory: apps/frontend
        run: >
          timeout 600s flutter build apk --debug
          --flavor publicalpha
          --target lib/public/main_public.dart
          --dart-define=SUPABASE_URL=https://aaaaaaaaaaaaaaaaaaaa.supabase.co
          --dart-define=SUPABASE_ANON_KEY=sb_publishable_synthetic_ci_only
          --dart-define=ARBOR_PUBLIC_API_URL=https://alpha.example.test
      - name: Verify synthetic public build exists
        working-directory: apps/frontend
        run: test -s build/app/outputs/flutter-apk/app-publicalpha-debug.apk
