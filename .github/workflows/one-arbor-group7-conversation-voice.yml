name: One Arbor Group 7 conversation and voice source acceptance

on:
  push:
    branches:
      - fix/one-arbor-group07-conversation-voice-20261007
  pull_request:
    branches:
      - integration/one-arbor-reconciled-335-339-20261007
    paths:
      - 'apps/backend/lib/arbor/accessibility/**'
      - 'apps/backend/lib/arbor/runtime/corrections.ts'
      - 'apps/backend/lib/arbor/runtime/__tests__/corrections.test.ts'
      - '.github/workflows/one-arbor-group7-conversation-voice.yml'

permissions:
  contents: read

concurrency:
  group: group7-conversation-voice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behavioral-source:
    if: github.repository == 'mikebuffan/Arbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore locked packages
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm install --frozen-lockfile
      - name: Control, shorthand, pragmatic and correction negative tests
        working-directory: apps/backend
        run: >
          pnpm exec vitest run
          lib/arbor/accessibility/__tests__/cognitiveAccessLanguage.test.ts
          lib/arbor/continuity/__tests__/longitudinalShorthand.integration.test.ts
          lib/arbor/runtime/__tests__/corrections.test.ts
          lib/arbor/pragmatics/__tests__/humorPolicy.test.ts
          lib/arbor/behavior/behaviorProjection.test.ts
          lib/arbor/voice/__tests__/acousticProjection.test.ts
          lib/arbor/voice/__tests__/canonicalTurn.test.ts
          lib/arbor/voice/__tests__/identity.test.ts
          lib/arbor/voice/__tests__/speechPipeline.test.ts
      - name: Backend typecheck
        working-directory: apps/backend
        run: pnpm exec tsc --noEmit
