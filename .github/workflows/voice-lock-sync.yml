name: Voice Lock Sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'arbor-live-voice-ui'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: arbor-live-voice-ui

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: apps/frontend
        run: flutter pub get

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- apps/frontend/pubspec.lock; then
            exit 0
          fi

          git config user.name "Arbor CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/frontend/pubspec.lock
          git commit -m "chore(flutter): refresh dependency lock"
          git push origin HEAD:arbor-live-voice-ui
