name: Annabelle finish exact-head acceptance

on:
  push:
    branches:
      - feature/annabelle-finish-20261006
      - integration/one-arbor-machine-ready-20261006

permissions:
  contents: read

concurrency:
  group: annabelle-finish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: github.repository == 'mikebuffan/Arbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm install --frozen-lockfile
      - name: Install local PDF parser dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdfinfo -v
          pdftotext -v
      - name: Annabelle and Felt-Life focused acceptance
        working-directory: apps/backend
        run: pnpm exec vitest run lib/arbor/annabelle lib/arbor/feltLife lib/arbor/agency/__tests__/continuationContract.test.ts lib/arbor/agency/__tests__/continuationRegression.test.ts
      - name: Full backend regression
        run: pnpm --filter firefly-backend test
      - name: TypeScript
        if: always()
        working-directory: apps/backend
        run: pnpm exec tsc --noEmit
      - name: Production backend build
        if: always()
        run: pnpm --filter firefly-backend build

  phone:
    if: github.repository == 'mikebuffan/Arbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install pinned Flutter
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="$RUNNER_TEMP/annabelle-finish-flutter"
          git init "$sdk_dir"
          git -C "$sdk_dir" remote add origin https://github.com/flutter/flutter.git
          git -C "$sdk_dir" fetch --depth=1 origin refs/tags/3.47.6:refs/tags/3.47.6
          git -C "$sdk_dir" checkout --detach refs/tags/3.47.6
          echo "$sdk_dir/bin" >> "$GITHUB_PATH"
          "$sdk_dir/bin/flutter" config --no-analytics
      - name: Resolve locked Flutter dependencies
        working-directory: apps/frontend
        run: flutter pub get --enforce-lockfile
      - name: Flutter analyze
        working-directory: apps/frontend
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Flutter tests
        working-directory: apps/frontend
        run: timeout 420s flutter test --reporter expanded
