name: One Arbor recovery and Glow vs Noise source acceptance

on:
  pull_request:
    branches:
      - test/one-arbor-may-route-compatibility-20261007
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/backend/lib/arbor/continuity/conversationRecovery.ts'
      - 'apps/backend/lib/arbor/continuity/__tests__/conversationRecovery.test.ts'
      - 'apps/arbor-control-backend/src/glowNoiseDecision.ts'
      - 'apps/arbor-control-backend/src/glowNoiseDecision.test.ts'
      - '.github/workflows/one-arbor-recovery-glow-noise.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arbor-recovery-glow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bounded-source-validation:
    if: github.repository == 'mikebuffan/Arbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      CI: 'true'
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm install --frozen-lockfile
      - name: Conversational recovery and existing agency regression
        working-directory: apps/backend
        run: >-
          pnpm exec vitest run
          lib/arbor/continuity/__tests__/conversationRecovery.test.ts
          lib/arbor/agency/__tests__
          lib/arbor/continuity/__tests__
      - name: Existing control backend and Glow vs Noise tests
        run: |
          pnpm --filter arbor-control-backend test
          pnpm --filter arbor-control-backend build
      - name: Verify Poppler for existing research/PDF regression
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null; then
            timeout 120s sudo apt-get update
            timeout 120s sudo apt-get install -y poppler-utils
          fi
      - name: Full backend regression
        run: pnpm --filter firefly-backend test
      - name: Backend TypeScript
        working-directory: apps/backend
        run: pnpm exec tsc --noEmit
