name: ARK conversation-control source acceptance

on:
  push:
    branches:
      - fix/ark-conversation-control-hold-20261011

permissions:
  contents: read

concurrency:
  group: ark-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controls:
    if: github.repository == 'mikebuffan/Arbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm deployment stays blocked
        run: VERCEL_GIT_COMMIT_REF=fix/ark-conversation-control-hold-20261011 node ops/grove/source-only-ignore.mjs
      - name: Restore locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm install --frozen-lockfile
      - name: STOP and continuation regressions (no model calls)
        working-directory: apps/backend
        run: >
          pnpm exec vitest run
          lib/arbor/agency/__tests__/continuation.test.ts
          lib/arbor/continuity/__tests__/longitudinalShorthand.integration.test.ts
          lib/arbor/language/__tests__/contextualReferenceResolution.test.ts
          lib/arbor/agency/__tests__/sessionInterruption.reconciliation.test.ts
          lib/arbor/pragmatics/__tests__/humorPolicy.test.ts
      - name: Backend TypeScript typecheck
        working-directory: apps/backend
        run: pnpm exec tsc --noEmit
