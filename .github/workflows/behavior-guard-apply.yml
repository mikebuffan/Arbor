name: Behavior Guard Apply

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'arbor-behavior-regression-guard'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: arbor-behavior-regression-guard

      - name: Apply remaining behavior guard wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match in {path}, found {count}")
              p.write_text(text.replace(old, new, 1))

          agent = "apps/backend/lib/arbor/agency/openaiAgent.ts"
          replace_once(
              agent,
              '      strategyCorrection:\n        string | null;\n    },',
              '      strategyCorrection:\n        string | null;\n      behaviorViolations: string[];\n    },',
              "agent verification hook type",
          )
          replace_once(
              agent,
              '    allowWebResearch?: boolean;\n    verifyCompletion?: boolean;\n    maxRounds?: number;',
              '    allowWebResearch?: boolean;\n    verifyCompletion?: boolean;\n    behaviorRequirements?: string[];\n    maxRounds?: number;',
              "agent behavior requirements input",
          )
          replace_once(
              agent,
              '            goal,\n            candidateText:\n              text,\n          },',
              '            goal,\n            candidateText:\n              text,\n            behaviorRequirements:\n              input.behaviorRequirements,\n          },',
              "agent verifier call",
          )

          prompt = "apps/backend/lib/prompt/buildPromptContext.ts"
          replace_once(
              prompt,
              '  behaviorProof: ArborBehaviorProof;\n  hostState: OneArborHostState;',
              '  behaviorProof: ArborBehaviorProof;\n  behaviorGuardRequirements: string[];\n  hostState: OneArborHostState;',
              "prompt context type",
          )
          replace_once(
              prompt,
              '    behaviorProof:\n      behaviorProjection.proof,\n    hostState: {',
              '    behaviorProof:\n      behaviorProjection.proof,\n    behaviorGuardRequirements:\n      behaviorProjection.guardRequirements,\n    hostState: {',
              "prompt context return",
          )

          route = "apps/backend/app/api/chat/route.ts"
          replace_once(
              route,
              '      activeSubsystem,\n      behaviorProof,\n    } = promptContext;',
              '      activeSubsystem,\n      behaviorProof,\n      behaviorGuardRequirements,\n    } = promptContext;',
              "route prompt destructure",
          )
          replace_once(
              route,
              '      allowWebResearch: process.env.ARBOR_ENABLE_WEB_RESEARCH !== "false",\n      hooks: {',
              '      allowWebResearch: process.env.ARBOR_ENABLE_WEB_RESEARCH !== "false",\n      behaviorRequirements: behaviorGuardRequirements,\n      hooks: {',
              "route agent requirements",
          )
          replace_once(
              route,
              '          evidence,\n          strategyCorrection,\n        }) {',
              '          evidence,\n          strategyCorrection,\n          behaviorViolations,\n        }) {',
              "route verification destructure",
          )
          replace_once(
              route,
              '                  behavior: behaviorProof,\n                  protectedCorrections,\n                  now: new Date().toISOString(),',
              '                  behavior: behaviorProof,\n                  protectedCorrections,\n                  newFailureIntroduced:\n                    behaviorViolations.length > 0,\n                  now: new Date().toISOString(),',
              "route self-update regression signal",
          )
          replace_once(
              route,
              '              strategyCorrection,\n              pendingSelfUpdate:\n                pendingSelfUpdate?.strategy ?? null,',
              '              strategyCorrection,\n              behaviorViolations,\n              pendingSelfUpdate:\n                pendingSelfUpdate?.strategy ?? null,',
              "route verification telemetry",
          )

          lifecycle = Path("apps/backend/lib/arbor/agency/__tests__/updateLifecycle.test.ts")
          text = lifecycle.read_text()
          if 'reverts an improved strategy when output behavior regresses' not in text:
              marker = '\n});\n'
              if not text.endswith(marker):
                  raise SystemExit("lifecycle test: unexpected ending")
              addition = '''

  it("reverts an improved strategy when output behavior regresses", () => {
    let update = beginSelfUpdate({
      id: "u4",
      strategy: "compress every answer",
      baselineScore: 0.4,
      behavior,
      protectedCorrections: [],
      now: "2026-09-10T21:00:00.000Z",
    });

    update = recordSelfUpdateVerification(
      update,
      {
        score: 0.9,
        behavior,
        protectedCorrections: [],
        newFailureIntroduced: true,
        now: "2026-09-10T21:01:00.000Z",
      },
    );

    update = recordSelfUpdateVerification(
      update,
      {
        score: 0.95,
        behavior,
        protectedCorrections: [],
        now: "2026-09-10T21:02:00.000Z",
      },
    );

    expect(
      decideSelfUpdate(update).decision.disposition,
    ).toBe("revert");
  });'''
              lifecycle.write_text(text[:-len(marker)] + addition + marker)
          PY

      - name: Commit remaining behavior guard wiring
        run: |
          git add \
            apps/backend/lib/arbor/agency/openaiAgent.ts \
            apps/backend/lib/arbor/agency/__tests__/updateLifecycle.test.ts \
            apps/backend/lib/prompt/buildPromptContext.ts \
            apps/backend/app/api/chat/route.ts

          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name "Arbor CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(agency): wire behavioral regressions into self-update"
          git push origin HEAD:arbor-behavior-regression-guard
