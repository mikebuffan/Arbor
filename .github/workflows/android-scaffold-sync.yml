name: Android Scaffold Sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'arbor-android-build-gate'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: arbor-android-build-gate

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing Android scaffold
        working-directory: apps/frontend
        run: >
          flutter create .
          --platforms=android
          --org com.example
          --project-name arbor

      - name: Preserve existing Arbor Android app source
        run: git checkout -- apps/frontend/android/app/src/main

      - name: Commit Android scaffold only
        run: |
          git add apps/frontend/android

          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name "Arbor CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "build(android): restore Flutter project scaffold"
          git push origin HEAD:arbor-android-build-gate
