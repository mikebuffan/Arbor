name: One Arbor batch 15 existing workspace acceptance
on:
  push:
    branches:
      - fix/batch15-ui-source-acceptance-20261009
permissions:
  contents: read
concurrency:
  group: one-arbor-batch15-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter-source-only:
    if: github.repository == 'mikebuffan/Arbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve existing Flutter dependencies
        run: flutter pub get
      - name: Analyze existing Group 15 surfaces
        run: >-
          flutter analyze
          lib/environment/arbor_environment_shell.dart
          lib/environment/grove_observatory_view.dart
          lib/environment/professional_workspace_view.dart
          lib/environment/grove_diary_draft_view.dart
          lib/environment/grove_room_inventory_panel.dart
          lib/environment/grove_room_inventory.dart
      - name: Existing navigation, truth, session draft and scenery tests
        run: >-
          flutter test
          test/environment_shell_test.dart
          test/environment_navigation_test.dart
          test/environment_live_ark_test.dart
          test/environment_diary_navigation_test.dart
          test/grove_diary_draft_test.dart
          test/professional_workspace_test.dart
          test/grove_workshop_preview_test.dart
          test/grove_room_inventory_test.dart
          test/grove_room_inventory_panel_test.dart
          test/grove_house_navigation_test.dart
          test/grove_observatory_view_test.dart
          test/grove_house_clock_test.dart
          test/grove_living_window_panel_test.dart
          test/grove_window_time_selection_test.dart
          test/grove_world_store_test.dart
          test/grove_world_panel_test.dart
          test/grove_responsive_wrap_test.dart
