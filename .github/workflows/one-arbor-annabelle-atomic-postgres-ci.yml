name: Annabelle isolated atomic PostgreSQL acceptance
'on':
  push:
    branches:
      - review/one-arbor-grove-d10-e09-compose-20261010
    paths:
      - 'docs/migrations/PROPOSED_annabelle_atomic_workspace_save.sql'
      - 'ops/annabelle/disposable-db/**'
      - '.github/workflows/one-arbor-annabelle-atomic-postgres-ci.yml'
permissions:
  contents: read
concurrency:
  group: annabelle-disposable-postgres-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-postgres:
    if: github.repository == 'mikebuffan/Arbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - name: Deny cloud metadata before source checkout and database startup
        shell: bash
        run: |
          set -euo pipefail
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          for key in HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy; do
            printf '%s=\n' "$key" >> "$GITHUB_ENV"
          done
          for net in 169.254.0.0/16 100.100.100.200/32; do
            sudo -n iptables -w 5 -I OUTPUT 1 -d "$net" -j REJECT
          done
          for net in fe80::/10 fc00::/7; do
            sudo -n ip6tables -w 5 -I OUTPUT 1 -d "$net" -j REJECT
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify source-only review branch blocks Vercel deployment
        run: |
          node ops/integration/verify-one-arbor-composition.mjs
          node --test ops/grove/source-only-ignore.test.mjs
      - name: Test proposed Annabelle SQL inside disposable PostgreSQL 17.6
        shell: bash
        run: |
          set -euo pipefail
          name=annabelle-atomic-disposable
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker pull postgres:17.6
          docker run --detach --name "$name" --network none \
            --env POSTGRES_PASSWORD=synthetic-disposable-fixture-only \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/source,readonly" \
            postgres:17.6
          ready=false
          for attempt in {1..30}; do
            if docker exec "$name" pg_isready --host 127.0.0.1 --username postgres; then
              ready=true
              break
            fi
            sleep 1
          done
          [ "$ready" = true ]
          docker exec "$name" psql --username postgres --dbname postgres \
            --set ON_ERROR_STOP=on \
            --file /source/ops/annabelle/disposable-db/acceptance.sql
      - name: Ensure reviewed repository files were not rewritten
        run: git diff --exit-code
