name: Execution Commitment Check

on:
  push:
    branches:
      - arbor/continuity-gap-integration
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.30.3 --activate
      - run: pnpm install --frozen-lockfile

      - name: Run execution commitment and continuity regressions
        env:
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
        run: >
          pnpm --filter firefly-backend exec vitest run
          lib/arbor/agency/__tests__/executionCommitment.test.ts
          lib/arbor/agency/__tests__/openLoops.test.ts
          lib/arbor/agency/__tests__/sessionTransition.test.ts
          lib/arbor/agency/__tests__/continuation.test.ts

      - name: Build Firefly backend
        env:
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
        run: pnpm --filter firefly-backend build

      - name: Test control backend
        env:
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
        run: pnpm --filter arbor-control-backend test

      - name: Build control backend
        env:
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
        run: pnpm --filter arbor-control-backend build
