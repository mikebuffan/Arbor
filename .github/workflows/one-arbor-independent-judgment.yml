name: One Arbor independent judgment source acceptance (not model evaluation)

on:
  push:
    branches:
      - test/one-arbor-independent-judgment-20261007
  pull_request:
    branches:
      - review/one-arbor-group11-assembly-followon-20261007
    paths:
      - 'apps/backend/lib/arbor/behavior/**'
      - 'ops/grove/source-only-ignore.mjs'
      - 'docs/integration/ONE_ARBOR_COMPOSED_SOURCE_FINGERPRINTS_20261007.json'
      - '.github/workflows/one-arbor-independent-judgment.yml'

permissions:
  contents: read

concurrency:
  group: one-arbor-independent-judgment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    if: github.repository == 'mikebuffan/Arbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      AWS_EC2_METADATA_DISABLED: 'true'
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm this review branch cannot be deployed by Vercel
        run: |
          VERCEL_GIT_COMMIT_REF="test/one-arbor-independent-judgment-20261007" node ops/grove/source-only-ignore.mjs
      - name: Verify pinned source assembly and bounded additions
        run: node ops/integration/verify-one-arbor-composition.mjs
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm install --frozen-lockfile
      - name: Independent judgment fixtures, behavior contract, correction and consequence regressions
        working-directory: apps/backend
        run: >-
          pnpm exec vitest run
          lib/arbor/behavior/behaviorProjection.test.ts
          lib/arbor/behavior/__tests__/independentJudgmentCases.test.ts
          lib/arbor/behavior/__tests__/group07ConversationSurface.test.ts
          lib/arbor/runtime/__tests__/corrections.test.ts
          lib/arbor/runtime/__tests__/decisionAncestry.test.ts
          lib/arbor/runtime/__tests__/group09TruthConsequence.test.ts
      - name: Backend TypeScript
        working-directory: apps/backend
        run: pnpm exec tsc --noEmit
