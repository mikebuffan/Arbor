name: One Arbor independent judgment source acceptance (not model evaluation)

on:
  push:
    branches:
      - test/one-arbor-independent-judgment-20261007
      - review/one-arbor-judgment-green-baseline-20261007
      - review/one-arbor-judgment-feedback-gates-20261007
      - test/one-arbor-judgment-blind-pack-20261007
  pull_request:
    branches:
      - review/one-arbor-group11-assembly-followon-20261007
      - review/one-arbor-judgment-green-baseline-20261007
      - review/one-arbor-judgment-feedback-gates-20261007
    paths:
      - 'apps/backend/lib/arbor/behavior/**'
      - 'apps/backend/lib/prompt/buildPromptContext.ts'
      - 'apps/backend/lib/prompt/__tests__/buildPromptContext.freshness.test.ts'
      - 'ops/grove/source-only-ignore.mjs'
      - 'docs/integration/ONE_ARBOR_COMPOSED_SOURCE_FINGERPRINTS_20261007.json'
      - '.github/workflows/one-arbor-independent-judgment.yml'

permissions:
  contents: read

concurrency:
  group: one-arbor-independent-judgment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    if: github.repository == 'mikebuffan/Arbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      AWS_EC2_METADATA_DISABLED: 'true'
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm this review branch cannot be deployed by Vercel
        run: |
          VERCEL_GIT_COMMIT_REF="${{ github.head_ref || github.ref_name }}" node ops/grove/source-only-ignore.mjs
      - name: Ensure production branch is never swallowed by source-only fencing
        run: |
          set -euo pipefail
          if VERCEL_GIT_COMMIT_REF=main node ops/grove/source-only-ignore.mjs; then
            echo "::error::Source-only skip list incorrectly excludes production main"
            exit 1
          fi
          if VERCEL_GIT_COMMIT_REF=production node ops/grove/source-only-ignore.mjs; then
            echo "::error::Source-only skip list incorrectly excludes production ref"
            exit 1
          fi
      - name: Verify pinned source assembly and bounded additions
        run: node ops/integration/verify-one-arbor-composition.mjs
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm install --frozen-lockfile
      - name: Independent judgment fixtures, behavior contract, correction and consequence regressions
        working-directory: apps/backend
        run: >-
          pnpm exec vitest run
          lib/arbor/behavior/behaviorProjection.test.ts
          lib/arbor/behavior/__tests__/independentJudgmentCases.test.ts
          lib/arbor/behavior/__tests__/independentJudgmentBlindPack.test.ts
          lib/arbor/behavior/__tests__/independentJudgmentOfflineRunner.test.ts
          lib/ark/__tests__/previewAcceptanceRoute.test.ts
          lib/arbor/agency/__tests__/continuation.test.ts
          lib/memory/__tests__/storeCorrection.test.ts
          lib/arbor/behavior/__tests__/group07ConversationSurface.test.ts
          lib/arbor/behavior/__tests__/arkLayerReadContext.test.ts
          lib/prompt/__tests__/buildPromptContext.freshness.test.ts
          lib/arbor/runtime/__tests__/corrections.test.ts
          lib/arbor/runtime/__tests__/decisionAncestry.test.ts
          lib/arbor/runtime/__tests__/group09TruthConsequence.test.ts
      - name: Backend TypeScript
        working-directory: apps/backend
        run: pnpm exec tsc --noEmit
      - name: Ensure existing PDF parser test dependencies
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null; then
            timeout 120s sudo apt-get update
            timeout 120s sudo apt-get install -y poppler-utils
          fi
      - name: Full backend regression
        run: pnpm --filter firefly-backend test
      - name: Control backend regression and build
        run: |
          pnpm --filter arbor-control-backend test
          pnpm --filter arbor-control-backend build
      - name: Backend CI-only build (no deployment)
        run: pnpm --filter firefly-backend build
