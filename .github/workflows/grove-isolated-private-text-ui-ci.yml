name: Grove isolated private Text UI source acceptance

# Grove-only source review. No backend/model/ARK tasks or deployment.
on:
  push:
    branches:
      - fix/grove-private-refresh-revocation-20261009
      - test/grove-group5-rooms-20261010
      - test/grove-group6-workspaces-20261010
      - test/grove-group8-accessibility-20261010
      - review/grove-combined-ui-diary-20261010
      - review/grove-ui-phone-compose-20261010
      - review/grove-fullstack-source-compose-20261010
      - test/grove-android-debug-20261010

permissions:
  contents: read

concurrency:
  group: grove-ui-private-text-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-ui:
    if: github.repository == 'mikebuffan/Arbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout isolated Grove branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up the existing Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve existing Flutter packages
        run: flutter pub get
      - name: Analyze Grove private Text and auth scope
        run: >-
          flutter analyze --no-fatal-infos
          lib/pages/grove_private_text_page.dart
          lib/pages/grove_private_access_page.dart
          lib/pages/grove_private_project_gate.dart
          lib/environment/grove_house_room.dart
          lib/environment/grove_diary_draft_view.dart
          test/grove_group6_draft_safety_test.dart
          test/grove_diary_draft_test.dart
          test/grove_house_navigation_test.dart
          lib/environment/grove_private_conversations.dart
          lib/environment/grove_pending_turn_store.dart
          test/grove_private_text_page_test.dart
          test/grove_private_conversations_test.dart
      - name: Verify private refresh, scope, draft and retry behavior
        run: >-
          flutter test
          test/grove_private_text_page_test.dart
          test/grove_private_conversations_test.dart
          test/grove_pending_turn_store_test.dart
          test/grove_private_auth_boundary_test.dart
          test/grove_private_project_gate_test.dart
      - name: Verify existing Grove house/navigation baseline
        run: >-
          flutter test
          test/grove_house_navigation_test.dart
          test/environment_navigation_test.dart
          test/grove_responsive_wrap_test.dart
          test/grove_memory_shelf_view_test.dart
          test/grove_document_shelf_view_test.dart

      - name: Verify Grove professional workspace, unsaved Diary and Workshop
        run: >-
          flutter test
          test/professional_workspace_test.dart
          test/grove_diary_draft_test.dart
          test/grove_group6_draft_safety_test.dart
          test/grove_room_inventory_panel_test.dart

      - name: Verify composed phone parser, local draft, private Text and scope together
        run: >-
          timeout 240s flutter test --reporter expanded --concurrency=1
          test/grove_private_conversations_test.dart
          test/grove_pending_turn_store_test.dart
          test/grove_private_text_page_test.dart
          test/grove_private_auth_boundary_test.dart
          test/grove_private_project_gate_test.dart
          test/grove_private_projects_truth_test.dart
          test/grove_runtime_scope_test.dart
          test/grove_talk_private_boundary_test.dart

      - name: Verify Grove source-only deployment fences
        working-directory: .
        run: node --test ops/grove/source-only-ignore.test.mjs

      - name: Verify Grove recovery and cross-surface scope
        run: >-
          flutter test
          test/grove_runtime_scope_test.dart
          test/grove_private_projects_truth_test.dart
          test/grove_talk_private_boundary_test.dart
          test/grove_consolidation_regression_test.dart

  grove-android-debug:
    name: Grove unconfigured Android debug compile (source only)
    if: github.repository == 'mikebuffan/Arbor' && github.ref == 'refs/heads/test/grove-android-debug-20261010'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/frontend
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - name: Resolve locked Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify 223 reviewed source fingerprints
        working-directory: .
        run: node ops/integration/verify-one-arbor-composition.mjs
      - name: Verify Grove no-deploy branch policy
        working-directory: .
        run: node --test ops/grove/source-only-ignore.test.mjs
      - name: Compile Grove debug flavor with private auth intentionally unconfigured
        run: >-
          flutter build apk --debug --flavor grove
          --dart-define=GROVE_STANDALONE=true
      - name: Verify local APK output without uploading it
        run: >-
          test -s build/app/outputs/flutter-apk/app-grove-debug.apk
