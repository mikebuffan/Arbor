name: Arbor Control Backend

on:
  push:
    branches:
      - arbor-control-backend
  pull_request:
    paths:
      - "apps/arbor-control-backend/**"

jobs:
  control-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      - run: pnpm --filter arbor-control-backend test

      - run: pnpm --filter arbor-control-backend build
