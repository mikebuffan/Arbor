name: Grove LM phone readiness acceptance

on:
  pull_request:
    branches:
      - integration/one-arbor-current-20261006
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: grove-lm-phone-readiness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bounded-backend-lm:
    if: github.repository == 'mikebuffan/Arbor' && github.head_ref == 'integration/grove-lm-phone-readiness-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - name: Block metadata before checkout
        shell: bash
        run: |
          set -euo pipefail
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          for subnet in 169.254.0.0/16 100.100.100.200/32; do
            sudo -n iptables -w 5 -I OUTPUT 1 -d "$subnet" -j REJECT
            sudo -n iptables -w 5 -C OUTPUT -d "$subnet" -j REJECT
          done
          for subnet in fe80::/10 fc00::/7; do
            sudo -n ip6tables -w 5 -I OUTPUT 1 -d "$subnet" -j REJECT
            sudo -n ip6tables -w 5 -C OUTPUT -d "$subnet" -j REJECT
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm install --frozen-lockfile
      - name: Grove auth, continuity, bounded writes, LM and ARK acceptance
        working-directory: apps/backend
        run: >
          pnpm exec vitest run
          lib/grove/__tests__/privateReadBroker.test.ts
          lib/grove/__tests__/privateChatRoute.test.ts
          lib/grove/__tests__/privateConversationDiscovery.test.ts
          lib/grove/__tests__/privateConversationLoop.test.ts
          lib/grove/__tests__/privateTranscriptRoute.test.ts
          lib/grove/__tests__/privateTranscriptStore.test.ts
          lib/grove/__tests__/privateHostIsolation.test.ts
          lib/grove/__tests__/privateLmHostTransport.test.ts
          lib/grove/__tests__/privateCorrectionRoute.test.ts
          lib/grove/__tests__/privateCorrectionWritePreparation.test.ts
          lib/grove/__tests__/privateCorrectionConnection.test.ts
          lib/grove/__tests__/privateRuntimeGoalWrite.test.ts
          lib/grove/__tests__/privateRuntimeGoalRoute.test.ts
          lib/grove/__tests__/privateRuntimeTurnCapture.test.ts
          lib/grove/__tests__/privateArkObjectiveRun.test.ts
          lib/grove/__tests__/privateArkObjectiveRunRoute.test.ts
          lib/grove/__tests__/arkSpineContinuity.test.ts
          lib/grove/__tests__/arkSpineStartup.test.ts
          lib/arbor/behavior/__tests__/arkLayerReadContext.test.ts
          lib/arbor/selfModel/__tests__/personalityProjection.test.ts
      - name: Local LM manifest, limits, receiver smoke and CPU compatibility
        run: node --test ops/grove/local-lm/local-lm-prep.test.mjs
      - name: Production backend build
        run: pnpm --filter firefly-backend build
      - name: Standalone TypeScript
        working-directory: apps/backend
        run: pnpm exec tsc --noEmit
      - name: Diff hygiene
        run: git diff --check HEAD^

  phone:
    if: github.repository == 'mikebuffan/Arbor' && github.head_ref == 'integration/grove-lm-phone-readiness-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - name: Block metadata before checkout
        shell: bash
        run: |
          set -euo pipefail
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          for subnet in 169.254.0.0/16 100.100.100.200/32; do
            sudo -n iptables -w 5 -I OUTPUT 1 -d "$subnet" -j REJECT
            sudo -n iptables -w 5 -C OUTPUT -d "$subnet" -j REJECT
          done
          for subnet in fe80::/10 fc00::/7; do
            sudo -n ip6tables -w 5 -I OUTPUT 1 -d "$subnet" -j REJECT
            sudo -n ip6tables -w 5 -C OUTPUT -d "$subnet" -j REJECT
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install pinned Flutter
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="$RUNNER_TEMP/grove-readiness-flutter"
          git init "$sdk_dir"
          git -C "$sdk_dir" remote add origin https://github.com/flutter/flutter.git
          git -C "$sdk_dir" fetch --depth=1 origin refs/tags/3.47.6:refs/tags/3.47.6
          git -C "$sdk_dir" checkout --detach refs/tags/3.47.6
          test "$(git -C "$sdk_dir" rev-parse HEAD)" = 5fc346839b5d0eef006ed8404392afb4dfae428d
          echo "$sdk_dir/bin" >> "$GITHUB_PATH"
          "$sdk_dir/bin/flutter" config --no-analytics
      - name: Resolve locked Flutter dependencies
        working-directory: apps/frontend
        run: flutter pub get --enforce-lockfile
      - name: Lockfile unchanged
        run: git diff --exit-code -- apps/frontend/pubspec.lock
      - name: Analyze
        working-directory: apps/frontend
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Full Flutter regression suite
        working-directory: apps/frontend
        run: timeout 360s flutter test --reporter expanded
      - name: Compile synthetic Grove APK
        working-directory: apps/frontend
        run: >
          timeout 600s flutter build apk --debug --flavor grove
          --dart-define=GROVE_STANDALONE=true
          --dart-define=GROVE_PRIVATE_TALK_PREVIEW=true
          --dart-define=GROVE_PRIVATE_NEW_CONVERSATION_PREVIEW=false
          --dart-define=GROVE_SUPABASE_URL=https://fqjqpuaoifgbweiguacf.supabase.co
          --dart-define=GROVE_SUPABASE_ANON_KEY=sb_publishable_synthetic_ci_only
          --dart-define=GROVE_API_URL=https://ci-grove-api.example.invalid
      - name: Verify synthetic build exists
        working-directory: apps/frontend
        run: test -s build/app/outputs/flutter-apk/app-grove-debug.apk
