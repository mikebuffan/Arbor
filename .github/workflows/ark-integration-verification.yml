name: ARK integration verification

on:
  push:
    branches:
      - feature/ark-integration-20260918
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm --filter firefly-backend exec tsc --noEmit

      - name: Lint
        run: pnpm --filter firefly-backend lint

      - name: Tests
        run: pnpm --filter firefly-backend test
