name: Grove private read boundary verification

on:
  push:
    branches:
      - feat/grove-private-read-broker-20260921
  pull_request:
    branches:
      - feat/grove-private-owner-access-20260921
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grove-private-read-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Grove read-only backend and existing tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.30.3 --activate
      - run: pnpm install --frozen-lockfile
      - name: Verify private read broker and existing backend tests
        env:
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
        run: pnpm --filter firefly-backend test
      - name: Typecheck backend
        run: pnpm --filter firefly-backend exec tsc --noEmit
      - name: Build backend
        env:
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
        run: pnpm --filter firefly-backend build

  flutter:
    name: Grove and original app Flutter checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
