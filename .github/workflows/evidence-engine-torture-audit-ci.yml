name: Evidence Engine torture audit acceptance
on:
  pull_request:
    branches:
      - feat/epstein-source-privacy-ops-v7-20261001
      - research/evidence-engine-torture-audit-20261006
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm install --frozen-lockfile
      - name: Focused Evidence Engine audit tests
        working-directory: apps/backend
        run: pnpm exec vitest run lib/research/sourceIndependence.test.ts lib/research/claimEvidenceGraph.test.ts lib/research/failedLeadRouting.test.ts lib/research/entityResolution.test.ts lib/research/investigationGraph.test.ts lib/research/timelineAnalysis.test.ts lib/research/sourceChainReview.test.ts lib/research/patternHopDomainLenses.test.ts
      - name: Full backend regression
        run: pnpm --filter firefly-backend test
      - name: Production build
        run: pnpm --filter firefly-backend build
      - name: TypeScript
        working-directory: apps/backend
        run: pnpm exec tsc --noEmit
