name: One Arbor Group 4 scoped shelf paging acceptance

on:
  pull_request:
    branches:
      - review/one-arbor-composed-g01-g03-g04-g05-g06-20261007
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/backend/app/api/memory/items/route.ts'
      - 'apps/backend/lib/memory/__tests__/shelfPageRead.test.ts'
      - 'apps/frontend/lib/environment/grove_memory_shelf.dart'
      - 'apps/frontend/lib/environment/grove_memory_shelf_view.dart'
      - 'apps/frontend/test/grove_memory_shelf_test.dart'
      - 'apps/frontend/test/grove_memory_shelf_view_test.dart'
      - '.github/workflows/one-arbor-group04-shelf-pagination.yml'
      - 'ops/grove/source-only-ignore.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-arbor-group04-paging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scoped-backend:
    if: github.repository == 'mikebuffan/Arbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-only deploy exclusion
        run: |
          set -euo pipefail
          VERCEL_GIT_COMMIT_REF="${{ github.head_ref || github.ref_name }}" node ops/grove/source-only-ignore.mjs
      - name: Restore locked packages
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm install --frozen-lockfile
      - name: Memory shelf, ownership and retrieval negative tests
        working-directory: apps/backend
        run: >-
          pnpm exec vitest run
          lib/memory/__tests__/shelfPageRead.test.ts
          lib/memory/__tests__/routeOwnership.test.ts
          lib/memory/__tests__/retrievalExclusion.test.ts
          lib/memory/__tests__/projectIsolation.test.ts
          lib/memory/__tests__/readRecall.test.ts
          lib/memory/__tests__/historicalRecall.test.ts
      - name: Backend TypeScript
        working-directory: apps/backend
        run: pnpm exec tsc --noEmit

  scoped-flutter:
    if: github.repository == 'mikebuffan/Arbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Locked Flutter packages
        working-directory: apps/frontend
        run: flutter pub get --enforce-lockfile
      - name: Analyze memory shelf and tests
        working-directory: apps/frontend
        run: >-
          flutter analyze
          lib/environment/grove_memory_shelf.dart
          lib/environment/grove_memory_shelf_view.dart
          test/grove_memory_shelf_test.dart
          test/grove_memory_shelf_view_test.dart
      - name: Owned memory and document shelf tests
        working-directory: apps/frontend
        run: >-
          flutter test
          test/grove_memory_shelf_test.dart
          test/grove_memory_shelf_view_test.dart
          test/grove_document_shelf_test.dart
          test/grove_document_shelf_view_test.dart
