name: One Arbor host recovery read acceptance

on:
  pull_request:
    branches:
      - test/one-arbor-recovery-glow-noise-20261007
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/backend/lib/arbor/host/recoveryReadProjection.ts'
      - 'apps/backend/lib/arbor/host/__tests__/recoveryReadProjection.test.ts'
      - '.github/workflows/one-arbor-host-recovery-read.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arbor-host-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  read-only-host-gates:
    if: github.repository == 'mikebuffan/Arbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm install --frozen-lockfile
      - name: Host recovery and existing identity/agency tests
        working-directory: apps/backend
        run: >-
          pnpm exec vitest run
          lib/arbor/host/__tests__
          lib/arbor/continuity/__tests__
          lib/arbor/agency/__tests__
      - name: Standalone backend TypeScript
        working-directory: apps/backend
        run: pnpm exec tsc --noEmit
