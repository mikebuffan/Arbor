name: One Arbor 15-lane source assembly negative and build gates
on:
  push:
    branches:
      - review/one-arbor-15-lane-source-assembly-20261007
      - review/one-arbor-group11-assembly-followon-20261007
      - test/one-arbor-judgment-blind-pack-20261007
      - review/one-arbor-b12-candidate-shape-20261007
      - prep/one-arbor-ark-preview-20261008
      - review/one-arbor-b12-candidate-lifecycle-20261008
      - review/one-arbor-preview-status-race-20261008
      - review/one-arbor-372-373-safe-composition-20261009
      - review/one-arbor-ark-receipt-task-scope-20261009
      - review/one-arbor-ark-completion-readback-20261009
      - review/one-arbor-workflow-choice-20261009
      - review/one-arbor-firefly-provenance-20261009
      - review/one-arbor-discovery-progress-20261009
      - review/one-arbor-independent-chat-integration-20261009
      - review/one-arbor-independence-budget-preflight-20261009
  pull_request:
    branches:
      - fix/one-arbor-group04-shelf-pagination-20261007
      - review/one-arbor-15-lane-source-assembly-20261007
      - test/one-arbor-judgment-blind-pack-20261007
    paths:
      - 'apps/**'
      - 'ops/grove/source-only-ignore.mjs'
      - 'ops/integration/verify-one-arbor-composition.mjs'
      - 'docs/integration/ONE_ARBOR_COMPOSED_SOURCE_FINGERPRINTS_20261007.json'
      - '.github/workflows/one-arbor-15-lane-assembly.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arbor15-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-control:
    if: github.repository == 'mikebuffan/Arbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Keep entire source assembly isolated from Vercel
        run: |
          set -euo pipefail
          VERCEL_GIT_COMMIT_REF="${{ github.head_ref || github.ref_name }}" node ops/grove/source-only-ignore.mjs
      - name: Verify all reviewed source fingerprints
        run: node ops/integration/verify-one-arbor-composition.mjs
      - name: Unauthenticated exact Preview deployment protection smoke check
        if: github.ref == 'refs/heads/review/one-arbor-preview-status-race-20261008'
        run: |
          set -euo pipefail
          hosts=(
            "firefly-ark-sandbox-hek3elo0r-mikes-projects-4d16734a.vercel.app"
            "firefly-ark-sandbox-git-prep-one-16dff9-mikes-projects-4d16734a.vercel.app"
          )
          for host in "${hosts[@]}"; do
            headers="$(mktemp)"
            trap 'rm -f "$headers"' EXIT
            status="$(curl --silent --show-error --max-time 18 --dump-header "$headers" --output /dev/null --write-out '%{http_code}' "https://$host/")"
            echo "Anonymous exact-Preview HTTP status: $status"
            case "$status" in
              401|403)
                echo "Anonymous request blocked at HTTP boundary"
                ;;
              301|302|303|307|308)
                location="$(grep -i '^location:' "$headers" | tail -n 1 | tr -d '\r' | sed -E 's/^[^:]*:[[:space:]]*//')"
                case "$location" in
                  https://vercel.com/*|*/_vercel/sso*|*/_vercel/auth*)
                    echo "Anonymous request redirected to Vercel authentication"
                    ;;
                  *)
                    echo "::error::Unverified anonymous redirect for exact Preview"
                    exit 1
                    ;;
                esac
                ;;
              *)
                echo "::error::Anonymous exact Preview was not access-denied (HTTP $status)"
                exit 1
                ;;
            esac
            rm -f "$headers"
            trap - EXIT
          done
      - name: Restore locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm install --frozen-lockfile
      - name: Group 4, 7-10, 12, 14, 15 regressions
        working-directory: apps/backend
        run: >-
          pnpm exec vitest run
          lib/memory/__tests__/candidateContext.test.ts
          lib/arbor/agency/__tests__/acceptanceRunner.test.ts
          lib/arbor/agency/__tests__/providerCompletionBoundary.test.ts
          lib/arbor/behavior/__tests__/independentJudgmentBlindPack.test.ts
          lib/arbor/behavior/__tests__/independentJudgmentOfflineRunner.test.ts
          lib/arbor/behavior/__tests__/proactiveJudgmentOfflineRunner.test.ts
          lib/memory/__tests__/candidateLifecycleExclusion.test.ts
          lib/ark/__tests__/latestStatusRequest.test.ts
          lib/ark/__tests__/readModel.test.ts
          lib/arbor/continuity/__tests__/storeScopeReadback.test.ts
          lib/arbor/subsystem/__tests__/stateReadbackScope.test.ts
          lib/arbor/agency/__tests__/stateScopeReadback.test.ts
          lib/memory/__tests__/historicalRecall.test.ts
          lib/arbor/episodes/__tests__/episodeRecallScope.test.ts
          lib/auth/__tests__/safeReturnPath.test.ts
          lib/memory/__tests__/shelfPageRead.test.ts
          lib/memory/__tests__/routeOwnership.test.ts
          lib/memory/__tests__/projectIsolation.test.ts
          lib/memory/__tests__/retrievalExclusion.test.ts
          lib/arbor/accessibility/__tests__/cognitiveAccessLanguage.test.ts
          lib/arbor/behavior/__tests__/group07ConversationSurface.test.ts
          lib/arbor/runtime/__tests__/corrections.test.ts
          lib/arbor/body/__tests__/bodySystem.test.ts
          lib/arbor/body/__tests__/gastricSignals.test.ts
          lib/learning/__tests__/bodyCausalNegativeControls.test.ts
          lib/arbor/runtime/__tests__/group09TruthConsequence.test.ts
          lib/arbor/runtime/__tests__/decisionAncestry.test.ts
          lib/arbor/runtime/__tests__/discoveryRadar.test.ts
          lib/arbor/runtime/__tests__/group11SourceBoundary.test.ts
          lib/memory/__tests__/patternHopSourceIndependence.test.ts
          lib/memory/__tests__/patternHopScopeReadback.test.ts
          lib/memory/__tests__/patternHopRetrieval.test.ts
          lib/memory/__tests__/historicalHopScopeReadback.test.ts
          lib/memory/__tests__/patternHopStoreScopeReadback.test.ts
          lib/memory/__tests__/patternHopEdgeReadbackScope.test.ts
          lib/memory/__tests__/patternHopPersistenceScope.test.ts
          lib/memory/__tests__/patternHopFailureReceipt.test.ts
          lib/memory/__tests__/patternHopRunWriteReceipt.test.ts
          lib/memory/__tests__/patternHopEdgeWriteReceipt.test.ts
          lib/arbor/annabelle/__tests__/editorialWriteReceiptIntegrity.test.ts
          lib/grove/__tests__/privateTranscriptStore.test.ts
          lib/arbor/annabelle/__tests__/group14PersistenceReadback.test.ts
          lib/arbor/records/__tests__/manualReview.test.ts
      - name: Ensure existing PDF parser test dependencies
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null; then
            timeout 120s sudo apt-get update
            timeout 120s sudo apt-get install -y poppler-utils
          fi
      - name: Full backend regression
        run: pnpm --filter firefly-backend test
      - name: Control backend regression and build
        run: |
          pnpm --filter arbor-control-backend test
          pnpm --filter arbor-control-backend build
      - name: Backend TypeScript
        working-directory: apps/backend
        run: pnpm exec tsc --noEmit
      - name: Backend CI-only build, no deployment
        run: pnpm --filter firefly-backend build

  grove-ui:
    if: github.repository == 'mikebuffan/Arbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - name: Block metadata before Flutter bootstrap; fail closed
        shell: bash
        run: |
          set -euo pipefail
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          for proxy_var in HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy; do
            printf '%s=\n' "$proxy_var" >> "$GITHUB_ENV"
          done
          for subnet in 169.254.0.0/16 100.100.100.200/32; do
            sudo -n iptables -w 5 -I OUTPUT 1 -d "$subnet" -j REJECT
            sudo -n iptables -w 5 -C OUTPUT -d "$subnet" -j REJECT
          done
          for subnet in fe80::/10 fc00::/7; do
            sudo -n ip6tables -w 5 -I OUTPUT 1 -d "$subnet" -j REJECT
            sudo -n ip6tables -w 5 -C OUTPUT -d "$subnet" -j REJECT
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore locked Flutter dependencies
        working-directory: apps/frontend
        run: flutter pub get --enforce-lockfile
      - name: Analyze memory, Grove, workspace and diary touched source
        working-directory: apps/frontend
        run: >-
          flutter analyze
          lib/environment/arbor_environment_shell.dart
          lib/environment/grove_room_inventory_panel.dart
          lib/environment/professional_workspace_view.dart
          lib/environment/grove_diary_draft_view.dart
          lib/environment/grove_memory_shelf.dart
          lib/environment/grove_memory_shelf_view.dart
          test/grove_workshop_preview_test.dart
          test/professional_workspace_test.dart
          test/grove_diary_draft_test.dart
          test/environment_diary_navigation_test.dart
      - name: Analyze private recovery with existing phone lint policy
        working-directory: apps/frontend
        run: >-
          flutter analyze --no-fatal-infos --no-fatal-warnings
          lib/pages/grove_private_text_page.dart
          test/grove_private_text_page_test.dart
      - name: Grove read-only and unsaved draft widget regressions
        working-directory: apps/frontend
        run: >-
          flutter test
          test/grove_memory_shelf_test.dart
          test/grove_memory_shelf_view_test.dart
          test/grove_workshop_preview_test.dart
          test/professional_workspace_test.dart
          test/grove_diary_draft_test.dart
          test/environment_diary_navigation_test.dart
          test/grove_private_project_gate_test.dart
          test/grove_private_text_page_test.dart
          test/grove_private_conversations_test.dart
          test/grove_pending_turn_store_test.dart
