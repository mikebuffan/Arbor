name: One Arbor continuity torture suite

on:
  pull_request:
    branches:
      - integration/one-arbor-current-20261006
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: one-arbor-torture-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend-continuity:
    if: github.repository == 'mikebuffan/Arbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - name: Block metadata before checkout
        shell: bash
        run: |
          set -euo pipefail
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          for subnet in 169.254.0.0/16 100.100.100.200/32; do
            sudo -n iptables -w 5 -I OUTPUT 1 -d "$subnet" -j REJECT
            sudo -n iptables -w 5 -C OUTPUT -d "$subnet" -j REJECT
          done
          for subnet in fe80::/10 fc00::/7; do
            sudo -n ip6tables -w 5 -I OUTPUT 1 -d "$subnet" -j REJECT
            sudo -n ip6tables -w 5 -C OUTPUT -d "$subnet" -j REJECT
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm install --frozen-lockfile
      - name: Continuation and interruption contracts
        working-directory: apps/backend
        run: >
          pnpm exec vitest run
          lib/arbor/agency/__tests__/continuationContract.test.ts
          lib/arbor/agency/__tests__/continuationRegression.test.ts
          lib/arbor/agency/__tests__/sessionInterruption.reconciliation.test.ts
          lib/arbor/agency/__tests__/workRunner.test.ts
          lib/arbor/agency/__tests__/verifier.test.ts
          lib/arbor/agency/__tests__/backlogContinuation.test.ts
          lib/arbor/agency/__tests__/completionEvidence.test.ts
          lib/arbor/agency/__tests__/tortureAcceptance.test.ts
          lib/arbor/agency/__tests__/objectiveLifecycle.test.ts
          lib/arbor/agency/__tests__/state.test.ts
      - name: Runtime memory and correction recovery
        working-directory: apps/backend
        run: >
          pnpm exec vitest run
          lib/arbor/runtime/__tests__/memoryRestart.test.ts
          lib/arbor/runtime/__tests__/durableCorrectionRetention.test.ts
          lib/arbor/runtime/__tests__/correctionRecovery.test.ts
          lib/arbor/runtime/__tests__/runtimeStateStore.test.ts
          lib/memory/__tests__/correctionResolution.test.ts
          lib/arbor/episodes/__tests__/summarizeEpisodeDurability.test.ts
      - name: Archive replay and duplicate resistance
        working-directory: apps/backend
        run: >
          pnpm exec vitest run
          lib/memory/__tests__/resumableArchive.test.ts
          lib/memory/__tests__/boundedHistoricalPlan.test.ts
          lib/memory/__tests__/archiveReader.test.ts
          lib/memory/__tests__/retrievalExclusion.test.ts
          lib/memory/__tests__/retrievedContextQuarantine.test.ts
          lib/memory/__tests__/historicalEmbeddingBackfill.test.ts
      - name: Grove and ARK restart composition
        working-directory: apps/backend
        run: >
          pnpm exec vitest run
          lib/grove/__tests__/arkSpineContinuity.test.ts
          lib/grove/__tests__/arkSpineStartup.test.ts
          lib/grove/__tests__/privateArkObjectiveRun.test.ts
          lib/grove/__tests__/privateCorrectionConnection.test.ts
          lib/grove/__tests__/privateConversationLoop.test.ts
          lib/grove/__tests__/privateRuntimeGoalWrite.test.ts
          lib/grove/__tests__/privateRuntimeTurnCapture.test.ts
          lib/ark/__tests__/runner.test.ts
          lib/ark/__tests__/stopSemantics.test.ts
          lib/ark/__tests__/cancelObjective.test.ts
          lib/ark/__tests__/taskStatus.test.ts
          lib/mcp/__tests__/taskPermissions.test.ts
          lib/mcp/__tests__/registerArkReadTools.test.ts
          lib/ark/__tests__/agencyDispatcher.test.ts
          lib/ark/__tests__/agencyToolExecutor.test.ts
          lib/ark/__tests__/agencyExecutionDelegate.test.ts
          lib/ark/__tests__/acceptanceConnection.integration.test.ts
      - name: Full backend suite
        working-directory: apps/backend
        run: pnpm test
      - name: Standalone TypeScript
        if: ${{ always() }}
        working-directory: apps/backend
        run: pnpm exec tsc --noEmit
      - name: Production build
        if: ${{ always() }}
        working-directory: apps/backend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
        run: pnpm build

  ark-stop-migration:
    if: github.repository == 'mikebuffan/Arbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arbor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arbor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: arbor_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Seed minimal Supabase-compatible schema
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create schema auth;
          create function auth.uid() returns uuid language sql stable as
            'select nullif(current_setting(''request.jwt.claim.sub'', true), '''')::uuid';
          create table auth.users (id uuid primary key);
          create table public.projects (
            id uuid primary key,
            user_id uuid not null references auth.users(id) on delete cascade
          );
          grant usage on schema public, auth to anon, authenticated, service_role;
          grant select on public.projects to service_role;
          SQL
      - name: Apply ARK schema plus source-only STOP migration
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260918143000_create_ark_autonomous_work_runner.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260918203000_ark_targeted_objective_claim.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260918210000_ark_owner_integrity.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261007005500_add_ark_cancel_objective.sql
      - name: Exercise terminal idempotent scoped STOP
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $do$
          declare
            u1 uuid := '11111111-1111-1111-1111-111111111111';
            u2 uuid := '22222222-2222-2222-2222-222222222222';
            p1 uuid := 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa';
            objective jsonb;
            claim jsonb;
            stopped jsonb;
            replay jsonb;
            retry_objective jsonb;
            retry_claim jsonb;
            retry_result jsonb;
            early_retry_claim jsonb;
            resumed_retry_claim jsonb;
            exhausted_result jsonb;
          begin
            insert into auth.users(id) values (u1), (u2);
            insert into public.projects(id,user_id) values (p1,u1);
            objective := public.ark_enqueue_objective(
              u1,p1,'stop safely',0,'{}'::jsonb,'stop:one',
              jsonb_build_array(jsonb_build_object(
                'task_key','execute','kind','arbor.agency-tool','description','bounded task',
                'dependencies','[]'::jsonb,'payload','{}'::jsonb,'max_attempts',3,'idempotency_key','stop:one:execute'
              ))
            );
            claim := public.ark_claim_next_task('worker-before-stop',10000,now(),'{}'::uuid[],(objective->>'id')::uuid);
            if claim is null or claim->'task'->>'status' <> 'running' then raise exception 'task was not running before STOP'; end if;
            if public.ark_claim_next_task('racing-worker',10000,now()+interval '1 second','{}'::uuid[],(objective->>'id')::uuid) is not null
              then raise exception 'second worker acquired an unexpired leased task'; end if;

            retry_objective := public.ark_enqueue_objective(
              u1,p1,'retry safely',0,jsonb_build_object('maxAttemptsPerTask',2),'retry:one',
              jsonb_build_array(jsonb_build_object(
                'task_key','execute','kind','arbor.agency-tool','description','bounded retry task',
                'dependencies','[]'::jsonb,'payload','{}'::jsonb,'max_attempts',2,'idempotency_key','retry:one:execute'
              ))
            );
            retry_claim := public.ark_claim_next_task('retry-worker-1',10000,now(),'{}'::uuid[],(retry_objective->>'id')::uuid);
            retry_result := public.ark_fail_task(
              (retry_claim->'task'->>'id')::uuid,'retry-worker-1',(retry_claim->'task'->>'lease_token')::uuid,
              'transient',now()+interval '5 seconds',now()+interval '1 second'
            );
            if retry_result->'task'->>'status' <> 'queued' then raise exception 'retry was not scheduled'; end if;
            early_retry_claim := public.ark_claim_next_task('retry-worker-early',10000,now()+interval '2 seconds','{}'::uuid[],(retry_objective->>'id')::uuid);
            if early_retry_claim is not null then raise exception 'retry ran before available_at'; end if;
            resumed_retry_claim := public.ark_claim_next_task('retry-worker-2',10000,now()+interval '6 seconds','{}'::uuid[],(retry_objective->>'id')::uuid);
            if resumed_retry_claim is null or (resumed_retry_claim->'task'->>'attempt_count')::integer <> 2
              then raise exception 'bounded retry did not resume same task at attempt two'; end if;
            exhausted_result := public.ark_fail_task(
              (resumed_retry_claim->'task'->>'id')::uuid,'retry-worker-2',(resumed_retry_claim->'task'->>'lease_token')::uuid,
              'still failing',now()+interval '10 seconds',now()+interval '7 seconds'
            );
            if exhausted_result->'task'->>'status' <> 'failed' or exhausted_result->'objective'->>'status' <> 'failed'
              then raise exception 'exhausted retry was not terminal failed'; end if;

            stopped := public.ark_cancel_objective((objective->>'id')::uuid,u1,p1,'User said STOP',now());
            if stopped->>'status' <> 'cancelled' then raise exception 'objective did not cancel'; end if;
            if exists(select 1 from public.ark_tasks where objective_id=(objective->>'id')::uuid and status <> 'cancelled')
              then raise exception 'unfinished task survived STOP'; end if;
            if exists(select 1 from public.ark_tasks where objective_id=(objective->>'id')::uuid
              and (lease_owner is not null or lease_token is not null or lease_expires_at is not null or heartbeat_at is not null))
              then raise exception 'STOP did not release lease'; end if;
            if public.ark_claim_next_task('worker-after-stop',1000,now()+interval '20 seconds','{}'::uuid[],(objective->>'id')::uuid) is not null
              then raise exception 'cancelled objective was claimable'; end if;

            replay := public.ark_cancel_objective((objective->>'id')::uuid,u1,p1,'User said STOP',now()+interval '1 second');
            if replay->>'status' <> 'cancelled' then raise exception 'STOP replay changed state'; end if;
            if (select count(*) from public.ark_events where objective_id=(objective->>'id')::uuid and event_type='objective_cancelled') <> 1
              then raise exception 'STOP replay duplicated cancellation event'; end if;

            begin
              perform public.ark_cancel_objective((objective->>'id')::uuid,u2,p1,'foreign stop',now());
              raise exception 'foreign owner STOP was accepted';
            exception when insufficient_privilege then null;
            end;
          end
          $do$;

          do $do$
          begin
            if has_function_privilege('authenticated','public.ark_cancel_objective(uuid,uuid,uuid,text,timestamptz)','execute')
              then raise exception 'authenticated role can execute protected STOP function'; end if;
            if not has_function_privilege('service_role','public.ark_cancel_objective(uuid,uuid,uuid,text,timestamptz)','execute')
              then raise exception 'service role missing protected STOP function'; end if;
          end
          $do$;
          SQL

  phone-continuity:
    if: github.repository == 'mikebuffan/Arbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - name: Block metadata before checkout
        shell: bash
        run: |
          set -euo pipefail
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          for subnet in 169.254.0.0/16 100.100.100.200/32; do
            sudo -n iptables -w 5 -I OUTPUT 1 -d "$subnet" -j REJECT
            sudo -n iptables -w 5 -C OUTPUT -d "$subnet" -j REJECT
          done
          for subnet in fe80::/10 fc00::/7; do
            sudo -n ip6tables -w 5 -I OUTPUT 1 -d "$subnet" -j REJECT
            sudo -n ip6tables -w 5 -C OUTPUT -d "$subnet" -j REJECT
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install pinned Flutter
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="$RUNNER_TEMP/one-arbor-flutter"
          git init "$sdk_dir"
          git -C "$sdk_dir" remote add origin https://github.com/flutter/flutter.git
          git -C "$sdk_dir" fetch --depth=1 origin refs/tags/3.47.6:refs/tags/3.47.6
          git -C "$sdk_dir" checkout --detach refs/tags/3.47.6
          test "$(git -C "$sdk_dir" rev-parse HEAD)" = 5fc346839b5d0eef006ed8404392afb4dfae428d
          echo "$sdk_dir/bin" >> "$GITHUB_PATH"
          "$sdk_dir/bin/flutter" config --no-analytics
      - name: Resolve locked Flutter dependencies
        working-directory: apps/frontend
        run: flutter pub get --enforce-lockfile
      - name: Lockfile unchanged
        run: git diff --exit-code -- apps/frontend/pubspec.lock
      - name: Focused restart and private-boundary tests
        working-directory: apps/frontend
        run: >
          timeout 420s flutter test --reporter expanded
          test/arbor_session_test.dart
          test/environment_runtime_retry_test.dart
          test/grove_pending_turn_store_test.dart
          test/grove_runtime_scope_test.dart
          test/grove_private_text_page_test.dart
          test/grove_private_ark_truth_test.dart
          test/grove_talk_private_boundary_test.dart
      - name: Analyze
        working-directory: apps/frontend
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
