name: RPC definition coverage audit

on:
  push:
    branches:
      - audit/rpc-contract-coverage-20261007

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'mikebuffan/Arbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm install --frozen-lockfile
      - name: Audit runtime RPC definitions
        working-directory: apps/backend
        run: pnpm exec vitest run lib/__tests__/rpcDefinitionCoverage.test.ts
