name: One Arbor Group12 reconciled source and Grove acceptance

on:
  pull_request:
    branches:
      - review/one-arbor-composed-g01-g03-g04-g05-g06-20261007
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-arbor-group12-composed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  combined-backend:
    if: github.repository == 'mikebuffan/Arbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source-only deployment fence
        run: |
          set -euo pipefail
          VERCEL_GIT_COMMIT_REF=review/one-arbor-group12-integration-20261007 node ops/grove/source-only-ignore.mjs
      - name: Verify reviewed source fingerprints and owner branch exclusions
        run: node ops/integration/verify-one-arbor-composition.mjs
      - name: Restore locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm install --frozen-lockfile
      - name: Combined core continuity and private Grove replay source contracts
        working-directory: apps/backend
        run: >-
          pnpm exec vitest run
          lib/grove/__tests__/privateTranscriptStore.test.ts
          lib/grove/__tests__/privateConversationLoop.test.ts
          lib/grove/__tests__/privateHostIsolation.test.ts
          lib/grove/__tests__/privateLmHostTransport.test.ts
          lib/grove/__tests__/privateRuntimeTurnCapture.test.ts
          lib/arbor/runtime/__tests__/timeCore.test.ts
          lib/arbor/language/__tests__/contextualReferenceResolution.test.ts
          lib/arbor/host/__tests__
          lib/arbor/continuity/__tests__
          lib/arbor/runtime/__tests__/correctionRecovery.test.ts
          lib/arbor/runtime/__tests__/durableCorrectionRetention.test.ts
          lib/arbor/runtime/__tests__/decisionAncestry.test.ts
          lib/arbor/selfModel/__tests__/group06EpistemicBoundaries.test.ts
          lib/memory/__tests__/projectIsolation.test.ts
          lib/memory/__tests__/routeOwnership.test.ts
          lib/memory/__tests__/retrievalExclusion.test.ts
          lib/memory/__tests__/archiveSourceInventory.test.ts
      - name: Verify PDF parser tools for existing backend suite
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null; then
            timeout 120s sudo apt-get update
            timeout 120s sudo apt-get install -y poppler-utils
          fi
          pdfinfo -v
          pdftotext -v
      - name: Full backend regression
        run: pnpm --filter firefly-backend test
      - name: Control backend regression and build
        run: |
          pnpm --filter arbor-control-backend test
          pnpm --filter arbor-control-backend build
      - name: Local LM manifest/holdout fixture isolation (no inference)
        run: |
          node --test ops/grove/local-lm/local-lm-prep.test.mjs
          node ops/grove/local-lm/validate-correction-fixtures.mjs
      - name: Backend TypeScript
        working-directory: apps/backend
        run: pnpm exec tsc --noEmit
      - name: Backend production build (CI only, never deploy)
        run: pnpm --filter firefly-backend build

  grove-native-transcript-claims:
    if: github.repository == 'mikebuffan/Arbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Start disposable socket-only PostgreSQL 16
        shell: bash
        run: |
          set -euo pipefail
          pg_bin=/usr/lib/postgresql/16/bin
          test -x "$pg_bin/initdb"
          pg_root="/tmp/grove-native-${GITHUB_RUN_ID}"
          mkdir -p "$pg_root/data" "$pg_root/socket"
          sudo -n chown -R postgres:postgres "$pg_root"
          sudo -n -u postgres "$pg_bin/initdb" -D "$pg_root/data" --auth=trust --no-locale
          sudo -n -u postgres "$pg_bin/pg_ctl" -D "$pg_root/data" -l "$pg_root/server.log" -o "-k $pg_root/socket -p 54329 -c listen_addresses=''" -w start
          printf 'PGHOST=%s/socket\nPGPORT=54329\nPGUSER=postgres\nPGDATABASE=grove_disposable\n' "$pg_root" >> "$GITHUB_ENV"
          echo "$pg_bin" >> "$GITHUB_PATH"
          "$pg_bin/createdb" -h "$pg_root/socket" -p 54329 -U postgres grove_disposable
      - name: Test exact proposed private transcript and claim migrations offline
        run: psql -X -v ON_ERROR_STOP=1 -f ops/grove/disposable-db/00-private-transcript-acceptance.sql
      - name: Twelve independent claim, lease reclaim and revocation transactions
        run: python3 ops/grove/disposable-db/native-claims.py --disposable-local
      - name: Stop disposable local PostgreSQL
        if: always()
        shell: bash
        run: |
          pg_root="/tmp/grove-native-${GITHUB_RUN_ID}"
          if test -f "$pg_root/data/postmaster.pid"; then
            sudo -n -u postgres /usr/lib/postgresql/16/bin/pg_ctl -D "$pg_root/data" -m immediate -w stop
          fi

  grove-memory-negative-tests:
    if: github.repository == 'mikebuffan/Arbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore Flutter packages
        working-directory: apps/frontend
        run: flutter pub get --enforce-lockfile
      - name: Analyze combined memory shelf
        working-directory: apps/frontend
        run: flutter analyze lib/environment/grove_memory_shelf.dart test/grove_memory_shelf_test.dart
      - name: Private memory scope, exclusion, and Grove gates
        working-directory: apps/frontend
        run: >-
          flutter test
          test/grove_memory_shelf_test.dart
          test/grove_memory_shelf_view_test.dart
          test/grove_private_project_gate_test.dart
          test/grove_document_shelf_test.dart
          test/grove_document_shelf_view_test.dart
