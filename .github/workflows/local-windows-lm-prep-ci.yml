name: Local Windows LM prep acceptance

on:
  pull_request:
    branches:
      - arbor/ark-spine-20261006
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: local-windows-lm-prep-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  node-contracts:
    if: github.repository == 'mikebuffan/Arbor' && github.head_ref == 'arbor/local-lm-windows-prep-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify manifest and loopback-only smoke contracts
        run: node --test ops/grove/local-lm/local-lm-prep.test.mjs

  windows-preflight:
    if: github.repository == 'mikebuffan/Arbor' && github.head_ref == 'arbor/local-lm-windows-prep-20261006'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert preflight contains no installer or network action
        shell: pwsh
        run: |
          $text = Get-Content -Raw ops/grove/local-lm/windows-preflight.ps1
          $forbidden = @(
            'Invoke-WebRequest',
            'Invoke-RestMethod',
            'Start-BitsTransfer',
            'winget install',
            'choco install',
            'pip install',
            'npm install',
            'curl.exe',
            'wget'
          )
          foreach ($needle in $forbidden) {
            if ($text -match [regex]::Escape($needle)) {
              throw "preflight contains forbidden action: $needle"
            }
          }
      - name: Run read-only Windows hardware preflight
        shell: pwsh
        run: |
          $json = & ./ops/grove/local-lm/windows-preflight.ps1
          $result = $json | ConvertFrom-Json
          if ($result.schemaVersion -ne 1) { throw 'schema mismatch' }
          if ($result.scope -ne 'read_only_local_hardware_preflight') { throw 'scope mismatch' }
          if ($result.machineIdentityCollected -ne $false) { throw 'machine identity must not be collected' }
          if ($result.assessment.intendedMode -ne 'cpu_only_bounded_pilot') { throw 'pilot mode mismatch' }
          if ($null -eq $result.processor.instructionSets.sse2) { throw 'SSE2 feature result missing' }
          if ($null -eq $result.processor.instructionSets.avx) { throw 'AVX feature result missing' }
          if ($null -eq $result.processor.instructionSets.avx2) { throw 'AVX2 feature result missing' }
          Write-Host "PASS: read-only Windows preflight executed; eligibility result is host-specific and not a model receipt."
  build-windows-x64-baseline:
    if: github.repository == 'mikebuffan/Arbor' && github.head_ref == 'arbor/local-lm-windows-prep-20261006'
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      LLAMA_CPP_SHA: 5ad1c5da0ad7f6176256b823925aad19134f0263
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Fetch exact llama.cpp source
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git llama.cpp
          Set-Location llama.cpp
          git checkout --detach $env:LLAMA_CPP_SHA
          $actual = git rev-parse HEAD
          if ($actual -ne $env:LLAMA_CPP_SHA) { throw "llama.cpp source mismatch: $actual" }
      - name: Configure x64 baseline without AVX
        shell: pwsh
        run: |
          $args = @(
            '-DCMAKE_BUILD_TYPE=Release',
            '-DBUILD_SHARED_LIBS=OFF',
            '-DGGML_NATIVE=OFF',
            '-DGGML_SSE42=OFF',
            '-DGGML_AVX=OFF',
            '-DGGML_AVX_VNNI=OFF',
            '-DGGML_AVX2=OFF',
            '-DGGML_BMI2=OFF',
            '-DGGML_AVX512=OFF',
            '-DGGML_AVX512_VBMI=OFF',
            '-DGGML_AVX512_VNNI=OFF',
            '-DGGML_AVX512_BF16=OFF',
            '-DGGML_FMA=OFF',
            '-DGGML_F16C=OFF',
            '-DGGML_CPU_ALL_VARIANTS=OFF',
            '-DGGML_OPENMP=OFF',
            '-DLLAMA_CURL=OFF',
            '-DLLAMA_BUILD_SERVER=ON',
            '-DLLAMA_BUILD_TESTS=OFF',
            '-DLLAMA_BUILD_EXAMPLES=ON'
          )
          cmake -S llama.cpp -B llama.cpp/build-sse2 -A x64 @args
      - name: Build local CPU runtime
        shell: pwsh
        run: cmake --build llama.cpp/build-sse2 --config Release --target llama-cli llama-server llama-bench --parallel 4
      - name: Verify built programs launch
        shell: pwsh
        run: |
          $bin = 'llama.cpp/build-sse2/bin/Release'
          & "$bin/llama-cli.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'llama-cli version failed' }
          & "$bin/llama-server.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'llama-server version failed' }
          & "$bin/llama-bench.exe" --help *> $null
          if ($LASTEXITCODE -ne 0) { throw 'llama-bench help failed' }
      - name: Package exact runtime with provenance
        shell: pwsh
        run: |
          $out = 'runtime-package'
          New-Item -ItemType Directory -Force $out | Out-Null
          $bin = 'llama.cpp/build-sse2/bin/Release'
          Copy-Item "$bin/llama-cli.exe" $out
          Copy-Item "$bin/llama-server.exe" $out
          Copy-Item "$bin/llama-bench.exe" $out
          Copy-Item 'llama.cpp/LICENSE' $out
          $files = Get-ChildItem $out -File | Where-Object { $_.Name -like '*.exe' } | ForEach-Object {
            [ordered]@{ name=$_.Name; sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); bytes=$_.Length }
          }
          $manifest = [ordered]@{
            schemaVersion=1
            scope='windows_x64_baseline_cpu_runtime'
            source=[ordered]@{ repository='ggml-org/llama.cpp'; commit=$env:LLAMA_CPP_SHA }
            intendedCpuFloor='x86_64_sse2'
            avxRequired=$false
            avx2Required=$false
            modelIncluded=$false
            adapterIncluded=$false
            files=@($files)
            claims=[ordered]@{
              binariesLaunchOnGithubWindowsRunner=$true
              qwenModelLoadVerified=$false
              targetLaptopExecutionVerified=$false
              arborAdapterVerified=$false
            }
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 "$out/RUNTIME_MANIFEST.json"
          Get-Content "$out/RUNTIME_MANIFEST.json"
      - name: Upload baseline runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: arbor-local-lm-windows-x64-sse2-${{ env.LLAMA_CPP_SHA }}
          path: runtime-package
          if-no-files-found: error
          retention-days: 14
